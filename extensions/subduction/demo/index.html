<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="description"
	content="Tabs as devices sharing a folder of notes through a Subduction server, with presence.">
<title>notes</title>
<link rel="stylesheet" href="style.css">
<header>
	<b>notes</b>
	<span id="who"></span>
	<span id="status" class="pill">…</span>
	<span class="grow"></span>
	<button id="copy"
		title="copy the link that opens this folder on another device">copy invite</button>
	<a id="another" target="_blank"
		title="a second device: a new tab with a new identity, this folder">another device</a>
</header>
<main>
	<nav>
		<form id="make"><input id="title" placeholder="new note" autocomplete="off"></form>
		<ul id="notes"></ul>
		<p class="hint" id="empty" hidden>nothing in the folder yet</p>
	</nav>
	<section id="editor" hidden>
		<div
			class="bar"><b id="name"></b><span id="versions"></span><button id="drop" title="take it out of the folder (the node stays)">take out</button></div>
		<div class="paper">
			<div id="mirror" aria-hidden="true"></div>
			<textarea id="text" spellcheck="false"></textarea>
		</div>
		<div id="forks"></div>
	</section>
	<aside>
		<h2>devices</h2>
		<ul id="peers"></ul>
		<p
			class="hint">a device is here while its beats arrive; the beats are ephemeral blops on its own node in the folder. what a node holds is shown, never chosen for you.</p>
	</aside>
</main>
<script type="module" src="page.ts"></script>
