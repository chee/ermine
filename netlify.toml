# the demos and /slaygrounds/, built static by vite: playground/demos' `deno task build` (vite.config.ts) builds each page and runs slaygrounds' own build into /slaygrounds/
[build]
  base = "."
  command = "curl -fsSL https://deno.land/install.sh | sh -s -- -y && export PATH=$HOME/.deno/bin:$PATH && cd playground/demos && deno task build"
  publish = "playground/demos/dist"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# slaygrounds' language server (49MB, under 100MB: ships); streaming compile wants this type
[[headers]]
  for = "/slaygrounds/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# the cat clock's compiler: wasm-clang (@yowasp/clang) at /catclock/compile, for the demos site
# (playground/catclock/functions/compile.mts). @yowasp/clang kept whole: its wasm beside its
# bundle.js (27 MB zipped)
[functions]
  directory = "playground/catclock/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@yowasp/clang"]
