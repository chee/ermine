# the demos, built static: playground/demos/build.ts bundles each page's .ts (Netlify can't run serve.ts)
[build]
  base = "."
  command = "curl -fsSL https://deno.land/install.sh | sh -s -- -y && $HOME/.deno/bin/deno run -A playground/demos/build.ts"
  publish = "playground/demos/dist"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
