<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ermine core</title>
    <meta name="description" content="play with ermine's graph, protect and drive" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..800,0..1,0..1,0..1&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='26' cy='30' rx='17' ry='15' fill='white' stroke='%232c2231' stroke-width='3'/><circle cx='21' cy='28' r='2.5' fill='%232c2231'/><circle cx='31' cy='28' r='2.5' fill='%232c2231'/><ellipse cx='26' cy='35' rx='3' ry='2' fill='%23e2457c'/></svg>"
    />
    <script>
      try {
        const t = localStorage.getItem("ermine-theme");
        document.documentElement.dataset.theme = t ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {}
    </script>
  </head>
  <body>
    <!-- riso paper, 2%: a hand-drawn roughness, three seeds to boil between -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="rough-1"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" /><feDisplacementMap in="SourceGraphic" scale="1.2" /></filter>
      <filter id="rough-2"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2" /><feDisplacementMap in="SourceGraphic" scale="1.2" /></filter>
      <filter id="rough-3"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" /><feDisplacementMap in="SourceGraphic" scale="1.2" /></filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
