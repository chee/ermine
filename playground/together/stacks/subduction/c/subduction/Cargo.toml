# subduction_c: Subduction for a C host, as a static library with a C ABI
# (subduction.h): no_std with alloc, sans-IO. The host owns every byte that
# comes or goes (its WebSocket), the clock, randomness and memory; the
# library speaks Subduction's protocol over the messages it is handed, on an
# executor of its own that runs only when the host calls it. NOTES.md.
#
# The Subduction crates are the crates.io releases pinned exactly to the
# versions inkandswitch/subduction 2566cbf (@automerge/subduction v0.23.0)
# declares, which TRANSPORT.tex names and galaxy.observer runs.

[package]
name = "subduction_c"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "subduction_c"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
future_form = "=0.3.1"
futures = { version = "0.3.31", default-features = false, features = ["alloc", "async-await"] }
# filled by the host's erm_host_random where there is no operating system to ask
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
nonempty = { version = "=0.12.0", default-features = false }
sedimentree_core = { version = "=0.14.2", default-features = false }
subduction_core = { version = "=0.18.2", default-features = false }
subduction_crypto = { version = "=0.9.2", default-features = false }
subduction_ephemeral = { version = "=0.8.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
