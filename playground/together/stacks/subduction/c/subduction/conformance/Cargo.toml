# The library's Rust checked on a desktop, with std: src/store.rs against
# subduction_core's own Storage conformance helpers over both C stores
# (store_memory.c, store_files.c), and src/memory.rs over a host whose
# malloc aligns only to a word. The files are the library's own, included by
# path (tests/). Same pins as ../Cargo.toml.

[package]
name = "subduction_c_conformance"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]

[dev-dependencies]
future_form = "=0.3.1"
futures = { version = "0.3.31", features = ["executor"] }
sedimentree_core = { version = "=0.14.2" }
subduction_core = { version = "=0.18.2", features = ["test_utils"] }
subduction_crypto = { version = "=0.9.2" }

[build-dependencies]
cc = "1"
