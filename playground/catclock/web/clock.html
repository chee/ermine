<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cat Clock</title>
		<style>
		html,
		body {
			margin: 0;
			height: 100%;
			background: linear-gradient(175deg, #dcecff, #fdf0f6);
		}
		body {
			padding: 4vh 16px;
			box-sizing: border-box;
		}
		main {
			height: 100%;
			display: grid;
			place-items: center;
		}
		canvas {
			display: block;
			image-rendering: pixelated;
		}
		</style>
	</head>
	<body>
		<main>
			<canvas width="150" height="300" aria-label="a cat clock"></canvas>
		</main>
		<script type="module">
		// the clock alone: catclock.wasm, run by canvas.js, the loader
		import run from "./canvas.js"
		const wasm = await (await fetch("catclock.wasm")).arrayBuffer()
		run({ wasm, canvas: document.querySelector("canvas") })
		</script>
	</body>
</html>
