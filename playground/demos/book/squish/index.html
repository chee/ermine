<!doctype html>
<html lang="en">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>many edits, one</title>
	<meta name="description"
		content="paint the pond's sign: every keystroke drops a slip, and the real squish turns the pile into fewer, bigger slips that paint the same sign.">
	<link rel="icon" href="../../pictures/ermine.svg" type="image/svg+xml">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
	<link rel="stylesheet" href="../book.css">
	<style>
	/* this page's own: the sign, the ducks, and the piles of slips */
	.signin {
		font: 700 18px var(--mono);
		width: 100%;
		padding: 4px 8px;
		border: 2px solid var(--ink);
		background: #fff;
		user-select: text;
	}
	.signin:focus {
		outline: none;
		border-color: var(--blue);
	}
	.row {
		display: flex;
		gap: 4px;
		align-items: center;
		margin-top: 6px;
	}
	.row .grow {
		flex: 1;
	}
	.ducks {
		list-style: none;
		margin: 0;
		padding: 0;
		font: 13px var(--mono);
	}
	.ducks li {
		display: flex;
		align-items: center;
		gap: 4px;
		padding: 1px 0;
	}
	.ducks li .name {
		flex: 1;
	}
	.ducks li.none {
		color: var(--grey);
	}
	.tiny {
		font: 700 11px var(--mono);
		width: 22px;
		height: 20px;
		padding: 0;
		border: 1.5px solid var(--ink);
		background: var(--paper);
		cursor: pointer;
	}
	.tiny:hover:not(:disabled) {
		background: var(--lemon);
	}
	.tiny:disabled {
		opacity: 0.25;
		cursor: default;
	}
	.pile {
		display: flex;
		flex-direction: column;
		gap: 4px;
		max-height: 300px;
		overflow: auto;
		padding: 2px 4px 6px 2px;
	}
	.pile .empty {
		font: 12px var(--mono);
		color: #aaa;
		text-align: center;
		padding: 18px 4px;
		border: 1.5px dashed #ccc;
	}
	.slip {
		position: relative;
		font: 11px/1.3 var(--mono);
		background: #fffdf0;
		border: 1px solid var(--ink);
		border-left: 4px solid var(--blue);
		padding: 2px 6px;
		box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		cursor: default;
	}
	.slip:nth-child(odd) {
		transform: rotate(-0.6deg);
	}
	.slip:nth-child(even) {
		transform: rotate(0.5deg);
	}
	.slip .on {
		color: var(--grey);
		margin-right: 4px;
	}
	.slip .fate {
		float: right;
		color: #13917a;
		margin-left: 6px;
	}
	.slip.rm {
		border-left-color: var(--cherry);
	}
	.slip.mv {
		border-left-color: #8a3ffc;
	}
	.slip.whole {
		border-left-width: 8px;
	}
	.slip.dead {
		color: #999;
		text-decoration: line-through;
		text-decoration-color: var(--cherry);
		background: #f4f4f4;
	}
	.slip.dead .fate {
		color: var(--cherry);
		text-decoration: none;
	}
	.slip.later {
		opacity: 0.3;
		border-style: dashed;
	}
	.slip.pick {
		background: var(--sky);
		outline: 2px solid var(--blue);
	}
	.slip:focus {
		outline: 2px solid var(--blue);
	}
	.big .slip {
		font-size: 13px;
		padding: 4px 8px;
		white-space: normal;
		overflow-wrap: anywhere;
	}
	.big .slip .fate {
		float: none;
		display: block;
		margin: 0;
		font-size: 10px;
	}
	.more {
		font: 10px var(--mono);
		color: var(--grey);
		text-align: center;
	}
	.press {
		text-align: center;
	}
	.press .count {
		font: 700 26px/1.1 var(--mono);
	}
	.press .count b {
		color: var(--cherry);
	}
	.press .what {
		font: 11px var(--mono);
		margin-top: 4px;
		min-height: 2.6em;
	}
	.same {
		text-align: center;
	}
	.same .mark {
		font: 700 44px/1 var(--mono);
		color: var(--stem);
	}
	.same.no .mark {
		color: var(--cherry);
	}
	.time .slider {
		width: 100%;
		accent-color: var(--blue);
	}
	.scene {
		position: relative;
	}
	.painted {
		position: absolute;
		left: 50%;
		bottom: -6px;
		transform: translateX(-50%);
		max-width: 92%;
		font: 700 22px/1.15 var(--mono);
		color: #3b2412;
		background: #f6e7c1;
		border: 4px solid #7a5230;
		box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
		padding: 2px 12px;
		white-space: pre;
		overflow: hidden;
		text-overflow: ellipsis;
		min-width: 3em;
		min-height: 1.6em;
		text-align: center;
	}
	.painted.blank {
		background: #efe4c8;
		border-style: dashed;
	}
	canvas.pond.small {
		width: 360px;
		height: 210px;
		margin-bottom: 18px;
	}
	</style>
	<header class="bar"></header>
	<main></main>
	<script type="module" src="./main.ts"></script>
