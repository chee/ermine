<!doctype html>
<html lang="en">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>copies nobody sees</title>
	<meta name="description"
		content="a pond, a camera and the real unread: writes change in place what they copied, until someone takes a photo.">
	<link rel="icon" href="../../pictures/ermine.svg" type="image/svg+xml">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
	<link rel="stylesheet" href="../book.css">
	<style>
	canvas.live {
		cursor: pointer;
		touch-action: none;
	}
	canvas.live.dragging {
		cursor: grabbing;
	}
	.handles {
		display: flex;
		gap: 4px;
		align-items: center;
		margin-top: 6px;
	}
	.handles input {
		font: 13px var(--mono);
		border: 1.5px solid var(--ink);
		padding: 2px 6px;
		width: 11em;
		margin-left: auto;
	}
	.handles .small {
		margin-left: 6px;
	}

	/* the value tree: a tile per container */
	.tree {
		display: flex;
		flex-direction: column;
		gap: 4px;
	}
	.kids {
		display: flex;
		flex-direction: column;
		gap: 4px;
		margin-left: 14px;
		padding-left: 6px;
		border-left: 1.5px dotted var(--grey);
	}
	.tile {
		display: flex;
		align-items: center;
		gap: 6px;
		border: 1.5px solid var(--ink);
		background: var(--paper);
		padding: 2px 4px 2px 6px;
		font: 12px var(--mono);
		min-height: 24px;
	}
	.tile .nm {
		font-weight: 700;
	}
	.tile .lf {
		color: var(--grey);
		flex: 1;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.tile .tg {
		font: 700 11px var(--mono);
		border: 1px solid var(--ink);
		padding: 0 4px;
		background: var(--paper);
		margin-left: auto;
		white-space: nowrap;
	}
	.tile.shared .tg {
		background: var(--stem);
	}
	.tile.copied {
		border-color: var(--cherry);
		border-width: 2px;
	}
	.tile.copied .tg {
		background: var(--cherry);
		border-color: var(--cherry);
		color: var(--paper);
	}
	.tile .what {
		font: 700 9px var(--mono);
		text-transform: uppercase;
		letter-spacing: 0.04em;
	}
	.tile.copied .what {
		color: var(--cherry);
	}
	.tile.same .what {
		color: var(--ink);
	}
	@keyframes pulse {
		from {
			background: var(--lemon);
			box-shadow: 0 0 0 3px #ffe23d;
		}
	}
	@keyframes arrive {
		from {
			background: var(--cherry);
			transform: scale(1.06);
		}
	}
	.tile.pulse {
		animation: pulse 0.9s ease-out;
	}
	.tile.arrive {
		animation: arrive 0.9s ease-out;
	}
	@media (prefers-reduced-motion: reduce) {
		.tile.pulse,
		.tile.arrive {
			animation: none;
		}
	}

	/* the count */
	.count {
		display: flex;
		align-items: baseline;
		gap: 10px;
	}
	.count .big {
		color: var(--cherry);
		font-size: 40px;
	}
	.count .vs {
		font: 12px var(--mono);
		color: var(--grey);
		line-height: 1.3;
	}
	.count .vs b {
		color: var(--ink);
		font-size: 16px;
	}

	/* the camera and the painter */
	.shoot {
		display: block;
		width: 100%;
		border: 1.5px solid var(--ink);
		background: var(--paper);
		padding: 6px 0 4px;
		cursor: pointer;
		font: 700 12px var(--mono);
	}
	.shoot:hover {
		background: var(--lemon);
	}
	.shoot canvas {
		display: block;
		margin: 0 auto 4px;
	}
	.pick {
		display: flex;
		flex-wrap: wrap;
		gap: 4px;
		margin-bottom: 6px;
	}

	/* a photo: a polaroid */
	.polaroid {
		background: #fff;
		padding: 8px 8px 4px;
		border: 1px solid #ccc;
		box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
	}
	.polaroid canvas {
		width: 240px;
		height: 140px;
		image-rendering: pixelated;
		display: block;
		border: 1px solid #999;
	}
	.portrait canvas {
		width: 132px;
		height: 72px;
		image-rendering: pixelated;
		display: block;
		border: 1px solid #999;
		background: #2269ff;
	}
	.chipsrow {
		display: flex;
		flex-wrap: wrap;
		gap: 3px;
		margin-top: 5px;
		align-items: center;
		font: 10px var(--mono);
		color: var(--grey);
	}
	.chipsrow .tg {
		font: 700 10px var(--mono);
		border: 1px solid var(--ink);
		padding: 0 3px;
		color: var(--ink);
	}
	.chipsrow .tg.shared {
		background: var(--stem);
	}
	.chipsrow .tg.gone {
		border-color: #bbb;
		color: #999;
	}
	</style>
	<header class="bar"></header>
	<main></main>
	<script type="module" src="./main.ts"></script>
