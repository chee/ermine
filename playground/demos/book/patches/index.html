<!doctype html>
<html lang="en">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>where a write lands</title>
	<meta name="description"
		content="a patch is a note: where (a path, maybe a range) and what to put there. post notes to the pond, watch what changes, undo them.">
	<link rel="icon" href="../../pictures/ermine.svg" type="image/svg+xml">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
	<link rel="stylesheet" href="../book.css">
	<style>
	/* the value, as a little tree */
	.pt-tree {
		font: 12px var(--mono);
		display: flex;
		flex-direction: column;
		gap: 3px;
	}
	.pt-row {
		display: flex;
		align-items: center;
		gap: 4px;
		min-height: 22px;
	}
	.pt-in {
		margin-left: 14px;
		padding-left: 6px;
		border-left: 3px solid #ddd;
		display: flex;
		flex-direction: column;
		gap: 3px;
	}
	.pt-in.shared {
		border-left-color: var(--stem);
	}
	.pt-in.new {
		border-left-color: var(--cherry);
	}
	.pt-k {
		font-weight: 700;
		padding: 1px 5px;
		background: var(--lemon);
		border: 1.5px solid transparent;
		cursor: pointer;
		white-space: nowrap;
	}
	.pt-k:hover {
		border-color: var(--ink);
	}
	.pt-k:focus-visible {
		outline: 2px solid var(--blue);
	}
	.pt-k.aim,
	.pt-leaf.aim {
		background: var(--blue);
		color: var(--paper);
	}
	.pt-k.from {
		outline: 2px dashed var(--blue);
	}
	.pt-k.drop,
	.pt-leaf.drop {
		outline: 2px dotted var(--ink);
	}
	.pt-kind {
		color: var(--grey);
		font-size: 10px;
	}
	.pt-leaf {
		padding: 1px 5px;
		border: 1.5px solid #ccc;
		cursor: pointer;
	}
	.pt-ghost {
		color: var(--blue);
		border: 1.5px dashed var(--blue);
		padding: 0 5px;
	}
	.pt-letters {
		display: flex;
		align-items: stretch;
		flex-wrap: nowrap;
		border: 1.5px solid #ccc;
		background: var(--paper);
		padding: 0 1px;
	}
	.pt-gap {
		width: 5px;
		cursor: text;
		align-self: stretch;
		min-height: 20px;
	}
	.pt-gap:hover {
		background: var(--sky);
	}
	.pt-gap.aim {
		background: var(--blue);
	}
	.pt-gap.drop {
		background: var(--ink);
	}
	.pt-gap.from {
		background: repeating-linear-gradient(var(--blue) 0 3px, transparent 3px 6px);
	}
	.pt-c {
		font: 14px var(--mono);
		min-width: 11px;
		text-align: center;
		cursor: text;
		white-space: pre;
		padding: 1px 0;
	}
	.pt-c.space {
		color: #bbb;
	}
	.pt-c.aim {
		background: var(--blue);
		color: var(--paper);
	}
	.pt-c.from {
		background: var(--sky);
		outline: 1.5px dashed var(--blue);
	}
	.pt-c.lit,
	.pt-row.lit > .pt-leaf,
	.pt-sign span.lit {
		animation: flash 1.1s ease-out;
	}
	.pt-items {
		display: flex;
		flex-direction: column;
	}
	.pt-items > .pt-gap {
		width: auto;
		min-height: 5px;
		height: 5px;
	}
	.pt-item {
		display: flex;
		align-items: flex-start;
		gap: 4px;
	}
	.pt-grip {
		cursor: grab;
		padding: 3px 2px 0;
	}
	.pt-grip:active {
		cursor: grabbing;
	}
	.pt-i {
		font: 10px var(--mono);
		background: #eee;
		padding: 2px 4px;
		cursor: text;
		margin-top: 2px;
	}
	.pt-i.aim {
		background: var(--blue);
		color: var(--paper);
	}
	.pt-i.from {
		background: var(--sky);
		outline: 1.5px dashed var(--blue);
	}
	.pt-item.moved {
		animation: flash 1.1s ease-out;
	}
	.pt-legend {
		font: 10px var(--mono);
		color: var(--grey);
		margin-top: 6px;
		display: flex;
		gap: 10px;
	}
	.pt-legend i {
		display: inline-block;
		width: 3px;
		height: 10px;
		vertical-align: -1px;
		margin-right: 4px;
	}

	/* the note: a little paper card */
	.box.pt-note {
		background: #fffdf3;
		transform: rotate(-1.2deg);
	}
	.box.pt-note .box-head {
		cursor: grab;
	}
	.pt-paper {
		font: 13px var(--mono);
		display: flex;
		flex-direction: column;
		gap: 6px;
		background: repeating-linear-gradient(transparent 0 21px, #e9e2c2 21px 22px);
	}
	.pt-line {
		display: flex;
		flex-wrap: wrap;
		gap: 3px;
		align-items: center;
	}
	.pt-line .w {
		color: var(--grey);
		font-size: 11px;
		width: 3.2em;
	}
	.pt-chip {
		background: var(--sky);
		padding: 0 4px;
	}
	.pt-chip.none {
		background: none;
		color: var(--grey);
	}
	.pt-paper input {
		font: 14px var(--mono);
		border: 0;
		border-bottom: 1.5px solid var(--ink);
		background: transparent;
		width: 100%;
		padding: 1px 2px;
	}
	.pt-paper input:focus {
		outline: none;
		border-bottom-color: var(--blue);
	}
	.pt-reads {
		font: 10px var(--mono);
		color: var(--grey);
	}
	.pt-post {
		display: flex;
		gap: 6px;
		align-items: center;
	}
	.pt-post .small {
		flex: 1;
	}
	.pt-bounce {
		border: 2px solid var(--cherry);
		background: var(--pink);
		padding: 4px 6px;
		font: 12px/1.3 Jost, system-ui, sans-serif;
	}
	.pt-bounce b {
		font: 700 12px var(--mono);
		color: var(--cherry);
	}
	.box.pt-note.sliding {
		transition: left 0.3s ease-out, top 0.3s ease-out;
	}

	/* the pond, with its sign */
	.pt-pondwrap {
		position: relative;
	}
	.pt-sign {
		position: absolute;
		left: 18px;
		bottom: 14px;
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		pointer-events: none;
	}
	.pt-sign .board-text {
		background: #f6e6b8;
		border: 2px solid var(--ink);
		padding: 2px 6px;
		font: 700 14px var(--mono);
		white-space: pre;
		box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.25);
	}
	.pt-sign .post {
		width: 6px;
		height: 12px;
		background: #7a5230;
		margin-left: 14px;
		border: 1.5px solid var(--ink);
		border-top: 0;
	}
	.pt-sign span.lit {
		color: var(--cherry);
	}

	/* the undo piles */
	.pt-piles {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 10px;
	}
	.pt-pile {
		position: relative;
		min-height: 88px;
	}
	.pt-pile .lab {
		font: 700 10px var(--mono);
		text-transform: uppercase;
		letter-spacing: 0.06em;
		margin-bottom: 4px;
	}
	.pt-card {
		position: absolute;
		left: 0;
		right: 0;
		font: 11px var(--mono);
		text-align: left;
		border: 1.5px solid var(--ink);
		background: #fffdf3;
		padding: 4px 6px;
		min-height: 52px;
		color: var(--ink);
		overflow-wrap: anywhere;
	}
	button.pt-card {
		cursor: pointer;
		box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
	}
	button.pt-card:hover,
	button.pt-card:focus-visible {
		background: var(--lemon);
	}
	.pt-card .go {
		display: block;
		color: var(--grey);
		font-size: 10px;
		margin-top: 3px;
	}
	.pt-empty {
		font: 11px var(--mono);
		color: var(--grey);
		border: 1.5px dashed #ccc;
		padding: 6px;
		min-height: 52px;
	}
	.pt-card.flash {
		animation: flash 0.9s ease-out;
	}

	.pt-odd {
		display: flex;
		flex-wrap: wrap;
		gap: 4px;
	}
	.pt-applied {
		font: 12px var(--mono);
		min-width: 9em;
	}
	.pt-applied .bad {
		color: var(--cherry);
		font-weight: 700;
	}
	.pt-paper [hidden],
	.pt-tree [hidden] {
		display: none;
	}
	.pt-pondwrap canvas.pond {
		width: 420px;
		height: 245px;
	}
	</style>
	<header class="bar"></header>
	<main></main>
	<script type="module" src="./main.ts"></script>
