<!doctype html>
<html lang="en">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>waiting</title>
	<meta name="description"
		content="the weather comes by duck: a computer waiting on a promise you hold, everything above it pending, the pond keeping its old picture, and why a run ends at its first await.">
	<link rel="icon" href="../../pictures/ermine.svg" type="image/svg+xml">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
	<link rel="stylesheet" href="../book.css">
	<style>
	/* this page's own: the sky the ducks fly in, the letter's choices, stale pictures */
	canvas.sky {
		display: block;
		width: 360px;
		height: 126px;
		image-rendering: pixelated;
		border: 1.5px solid var(--ink);
		cursor: pointer;
	}
	canvas.lane {
		display: block;
		width: 270px;
		height: 54px;
		image-rendering: pixelated;
		border: 1.5px solid var(--ink);
	}
	canvas.heaven {
		display: block;
		width: 480px;
		height: 80px;
		image-rendering: pixelated;
		border: 1.5px solid var(--ink);
		border-bottom: none;
	}
	.stale canvas.heaven {
		filter: grayscale(1);
		opacity: 0.45;
	}
	.stale .mid {
		color: var(--grey);
	}
	.letter {
		display: flex;
		gap: 4px;
		align-items: center;
		flex-wrap: wrap;
		margin-top: 6px;
		font: 12px var(--mono);
	}
	.letter[hidden] {
		display: none;
	}
	.letter .chip.drop {
		border-style: dashed;
	}
	.oldnote {
		font: 11px var(--mono);
		color: var(--grey);
	}
	.pix {
		image-rendering: pixelated;
		vertical-align: middle;
		margin-right: 6px;
	}
	</style>
	<header class="bar"></header>
	<main></main>
