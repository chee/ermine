<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="description"
	content="tenfold's shape on ermine's dens: letters are small draw programs, run every frame on a runner one engine process offers">
<title>tenfold, on dens</title>
<link rel="stylesheet" href="../shape/lib/style.css">
<style>
body {
	height: 100vh;
	display: flex;
	flex-direction: column;
}
main {
	flex: 1;
	display: grid;
	grid-template-columns: 3fr 2fr;
	min-height: 0;
}
canvas {
	width: 100%;
	height: 100%;
	background: #fff;
	cursor: pointer;
}
aside {
	display: flex;
	flex-direction: column;
	gap: 6px;
	padding: 8px;
	min-height: 0;
	border-left: 1px solid var(--line);
}
textarea {
	flex: 1;
	font: 13px/1.4 var(--mono);
	tab-size: 2;
}
label {
	display: grid;
	grid-template-columns: 2em 1fr 3em;
	align-items: center;
	font: 12px var(--mono);
}
#said {
	font: 12px var(--mono);
	min-height: 3em;
	white-space: pre-wrap;
}
@media (max-width: 760px) {
	main {
		grid-template-columns: 1fr;
		grid-template-rows: 1fr 1fr;
	}
}
</style>
<header
	class="bar"><a href="/"><b>ermine</b></a><span>tenfold, on dens</span><span class="grow"></span></header>
<main>
	<canvas id="screen"></canvas>
	<aside>
		<select id="letter" title="the letter this cell shows (its knob)"></select>
		<textarea id="source" spellcheck="false"
			title="the letter's source: drawn again as you type"></textarea>
		<label>q <input id="q" type="range" min="-1" max="1" step="0.01"><output></output></label>
		<label>r <input id="r" type="range" min="-1" max="1" step="0.01"><output></output></label>
		<label>x <input id="x" type="range" min="-1" max="1" step="0.01"><output></output></label>
		<label>y <input id="y" type="range" min="-1" max="1" step="0.01"><output></output></label>
		<div id="said"></div>
	</aside>
</main>
<script type="module" src="main.ts"></script>
