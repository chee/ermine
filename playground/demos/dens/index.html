<!doctype html>
<html lang="en">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>dens</title>
	<meta name="description"
		content="two people, two screens, one graph: make a den, add things to it and to a friend's, and wire them together">
	<link rel="icon" href="../pictures/ermine.svg" type="image/svg+xml">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&family=Petrona:ital,wght@0,400..600;1,400&display=swap">
	<link rel="stylesheet" href="./kit/pond.css">
	<link rel="stylesheet" href="./style.css">
	<svg width="0" height="0" style="position: absolute" aria-hidden="true">
		<filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
			<feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2"
				seed="1" />
			<feDisplacementMap in="SourceGraphic" scale="1.5" />
		</filter>
	</svg>
	<header class="bar">
		<a href="/"><b>ermine</b></a><span class="title">dens</span>
		<button id="code" class="code" hidden></button>
		<span id="room" class="room"></span>
		<form id="join" class="join" hidden><input name="code" placeholder="code" maxlength="6"
				autocomplete="off" spellcheck="false" aria-label="another room's code"><button>join</button></form>
		<span class="grow"></span>
		<span id="who"></span>
		<button id="rename" hidden>not you?</button>
		<button id="sound" aria-pressed="true">sound on</button>
	</header>
	<div class="welcome" hidden>
		<form class="card">
			<h1>what's your name?</h1>
			<input name="name" autocomplete="given-name" spellcheck="false" maxlength="24">
			<label class="joining">a code from someone's screen? <input name="code" maxlength="6"
					autocomplete="off" spellcheck="false" placeholder="optional"></label>
			<button class="go">make my den</button>
		</form>
	</div>
	<main class="pondpage" hidden>
		<div id="board"></div>
		<div class="caption"></div>
		<div class="asking" aria-live="polite"></div>
		<section class="dock" aria-label="this den's tree, and a terminal">
			<div class="dock-grab" title="drag to make it taller or shorter"></div>
			<section class="files window" aria-label="this den's tree, as files">
				<div class="toolbar">
					<span class="nav">
						<button class="round back" aria-label="back" title="back">
							<svg viewBox="0 0 10 10" aria-hidden="true">
								<path d="M6.5,1.5 L3,5 L6.5,8.5" />
							</svg>
						</button>
						<button class="round forward" aria-label="forward" title="forward">
							<svg viewBox="0 0 10 10" aria-hidden="true">
								<path d="M3.5,1.5 L7,5 L3.5,8.5" />
							</svg>
						</button>
					</span>
					<nav class="crumbs" aria-label="where you are"></nav>
					<span class="views" role="group" aria-label="view">
						<button data-view="icons" aria-label="icons" title="icons">
							<svg viewBox="0 0 14 14" aria-hidden="true">
								<rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1.2" />
								<rect x="8" y="1.5" width="4.5" height="4.5" rx="1.2" />
								<rect x="1.5" y="8" width="4.5" height="4.5" rx="1.2" />
								<rect x="8" y="8" width="4.5" height="4.5" rx="1.2" />
							</svg>
						</button>
						<button data-view="list" aria-label="list" title="list">
							<svg viewBox="0 0 14 14" aria-hidden="true">
								<path d="M2,3 H12 M2,7 H12 M2,11 H12" />
							</svg>
						</button>
						<button data-view="columns" aria-label="columns" title="columns">
							<svg viewBox="0 0 14 14" aria-hidden="true">
								<rect x="1.5" y="2" width="3.2" height="10" rx="1" />
								<rect x="5.4" y="2" width="3.2" height="10" rx="1" />
								<rect x="9.3" y="2" width="3.2" height="10" rx="1" />
							</svg>
						</button>
						<button data-view="map" aria-label="map" title="map">
							<svg viewBox="0 0 14 14" aria-hidden="true">
								<circle cx="3" cy="7" r="1.8" />
								<circle cx="11" cy="3" r="1.8" />
								<circle cx="11" cy="11" r="1.8" />
								<path
									d="M4.6,6.2 C7,4.6 7.4,3.4 9.3,3.1 M4.6,7.8 C7,9.4 7.4,10.6 9.3,10.9" />
							</svg>
						</button>
					</span>
					<span class="views toggles" role="group" aria-label="show">
						<button class="show-code" aria-pressed="false"
							title="this page's own code, and what runs">code</button>
						<button class="show-term" aria-pressed="true"
							title="the terminal: type commands">terminal</button>
						<button class="fold" aria-pressed="false"
							title="fold it down to this row">fold</button>
					</span>
				</div>
				<div class="panes">
					<aside class="side" aria-label="places"></aside>
					<div class="main"></div>
					<aside class="info" aria-label="the one picked" aria-live="polite"></aside>
				</div>
				<div class="status"></div>
			</section>
			<section class="code window" aria-label="this page's code">
				<div
					class="code-bar"><span class="title">code</span><span class="code-tabs"></span></div>
				<div class="code-body"></div>
				<div class="code-note"></div>
			</section>
			<section class="term window" aria-label="a terminal for this den">
				<div
					class="term-bar"><span class="title">terminal</span><span class="term-where"></span></div>
				<div class="term-out" role="log" aria-live="polite"></div>
				<form
					class="term-line"><label class="term-prompt" for="term-in"></label><input id="term-in"
						autocomplete="off" autocapitalize="off" spellcheck="false"
						aria-label="a command: help lists them"></form>
			</section>
		</section>
	</main>
	<script type="module" src="./main.ts"></script>
</html>
