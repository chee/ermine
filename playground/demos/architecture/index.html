<!doctype html>
<html lang="en">

<meta name="description" content="ermine's packages in four layers, and what imports what. drag them about; see them three ways.">
<link rel="icon" href="../pictures/ermine.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
<style>
:root {
	--page: #ff8;
	--ink: #000;
	--paper: #fff;
	--cherry: #ff2284;
	--stem: #40dcba;
	--blue: #2269ff;
	--pink: #ffdcea;
	--sky: #dce6ff;
	--mint: #ccf5e8;
	--lemon: #fff8c8;
	--lilac: #ece2ff;
	--mono: Monaco, "Lifesender Mono", ui-monospace, Menlo, monospace;
	font-family: Jost, system-ui, sans-serif;
	font-size: 16px;
	line-height: 1.4;
	color: var(--ink);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); display: flex; flex-direction: column; }
header {
	display: flex; align-items: center; gap: 1em; padding: 0.4em 16px;
	background: var(--ink); color: var(--paper);
}
header a { color: var(--paper); text-decoration: none; }
header a:hover { text-decoration: underline; text-decoration-color: var(--cherry); }
header .name { font-weight: 600; }
header .title { margin-right: auto; }
header button {
	font: 13px var(--mono); padding: 1px 8px; border: 1px solid var(--paper); border-radius: 2px;
	background: var(--ink); color: var(--paper); cursor: pointer;
}
header button:hover { background: #333; }
header button[aria-pressed="true"] { background: var(--page); color: var(--ink); border-color: var(--page); }
header .ways { display: flex; gap: 4px; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 4px; padding: 4px; min-height: 0; }
main.bare { grid-template-columns: minmax(0, 1fr); }
main.bare aside { display: none; }
.diagram, aside { background: var(--paper); border: 1px solid var(--ink); }
.diagram { position: relative; overflow: hidden; min-height: 0; }
svg { display: block; width: 100%; height: 100%; user-select: none; touch-action: none; cursor: grab; }
svg.panning { cursor: grabbing; }
.band { stroke: var(--ink); stroke-width: 1; }
.band-label { font: 700 11px var(--mono); letter-spacing: .04em; }
.band-note { font: 11px var(--mono); fill: #555; }
.rule { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 4; opacity: .35; }
.edge { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0; }
.edge.uses { stroke: var(--cherry); stroke-width: 2; opacity: 1; }
.edge.usedby { stroke: var(--blue); stroke-width: 2; opacity: 1; }
.node { cursor: pointer; }
.node.dragging { cursor: grabbing; }
.node rect.box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.node rect.tab { stroke: var(--ink); stroke-width: 1.5; }
.node text { font: 600 12px var(--mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node:hover rect.box { fill: var(--lemon); }
.node.uses rect.box { fill: var(--pink); stroke: var(--cherry); stroke-width: 2.5; }
.node.usedby rect.box { fill: var(--sky); stroke: var(--blue); stroke-width: 2.5; }

}

	display: inline-block; width: 12px; height: 12px; border: 1px solid var(--ink); vertical-align: -1px; margin-right: 6px;
}
aside p { margin: .6em 0; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }

.chip.u { background: var(--pink); }
.chip.b { background: var(--sky); }
.chip:hover { background: var(--lemon); }
.none { color: #666; font-size: .9rem; }
a { color: var(--blue); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(60vh, 1fr) auto; } }
</style>
<header>
	<a class="name" href="../">🐰 ermine demos</a>
	<span class="title">architecture</span>
	<span class="ways" role="group" aria-label="way to see">
		<button data-way="layers">layers</button>
		<button data-way="depth">depth</button>
		<button data-way="loose">loose</button>
	</span>
	<button id="fit" title="fit everything in view (f)">fit</button>
	<button id="panel" aria-pressed="true" title="show or hide the side panel">panel</button>
</header>
<main>
	<div class="diagram">
		<svg id="svg" role="img" aria-label="ermine's packages and their imports"></svg>
		<div class="key"><span class="u"></span><span class="b"></span></div>
		<div class="hint">drag a box to move it · drag the paper to pan · pinch or ctrl+scroll to zoom</div>
	</div>
	<aside id="info"></aside>
</main>
<script>
// layers, top to bottom: what builds on what. each package: where it lives, what it is (from its
// own header comment), and the packages its source imports (tests and benches left out)
const LAYERS = [
	{ id: "extensions", note: "sync, presence, builds, programs, patch-nodes", fill: "#ece2ff",
		rows: ["sync subduction presence patch-nodes programs build"] },
	{ id: "ermine", note: "what makes the graph a place programs live in", fill: "#ccf5e8",
		rows: ["realms api processes boxes types sites encoding"] },
	{ id: "filesystem", note: "paths over the table: who is where, who may", fill: "#ffdcea",
		rows: ["places clingy protect"] },
	{ id: "core", note: "small. nothing above is imported here", fill: "#fff8c8",
		rows: ["scheduler unread table node op util blake3"] },
]
const PKG = {
	blake3: ["core", "hashing in JS and wasm, for change names"],
	node: ["core", "a node's entry and its change header: who, when, from where in code; update applies a change"],
	op: ["core", "patches applied to one value, with their undo built on the way. map key order is not part of a value"],
	scheduler: ["core", "runs computers when what they read changes; scopes, tracking, boundaries, pending"],
	table: ["core", "entries held in memory under a table name and an id; one listener told of every change"],
	unread: ["core", "writes stay in place until something reads them"],
	util: ["core", "stacktraces and string walking: the small shared parts"],
	places: ["filesystem", "paths and children over the table: get, list, members, contributors, a cache per path"],
	protect: ["filesystem", "may this actor do this to that, at this version? an answer only, never an effect"],
	api: ["ermine", "the process api: what a program is given (open, read, edit, memo, effect, method, send)"],
	boxes: ["ermine", "a / of a process's own: what is boxed sees nothing above its folder"],
	clingy: ["filesystem", "keys known tracked or not, told when the last tracker goes"],
	encoding: ["ermine", "canonical CBOR, and one change to one object as one item (a blop)"],
	processes: ["ermine", "running processes placed at paths; the ephemeral wins while it runs"],
	realms: ["ermine", "a realm in a worker: its own scheduler and table, crossing by messages"],
	sites: ["ermine", "every write from outside captures where in code it came from, held unread until asked"],
	types: ["ermine", "UTIs as nodes: what a loader takes and gives, with conformance"],
	build: ["extensions", "steps cached with verifying traces (build systems à la carte); compile is a step"],
	"patch-nodes": ["extensions", "precise telling: a change says what it touched"],
	presence: ["extensions", "an ephemeral channel: bytes on a topic, saved nowhere; gone comes from rows' until"],
	programs: ["extensions", "loaders and runners: code from the graph run as a program, including native via dlopen"],
	subduction: ["extensions", "histories of blops, worked out into what an object holds; signed"],
	sync: ["extensions", "ermine over Subduction: commits, and presence over a device's ephemeral messages"],
}
const USES = {
	blake3: "", node: "op util", op: "util", scheduler: "op", table: "node", unread: "node op scheduler table", util: "",
	places: "clingy node op protect scheduler table util", protect: "op",
	api: "boxes node op patch-nodes places presence programs protect scheduler sites table",
	boxes: "node places processes scheduler table util", clingy: "scheduler", encoding: "blake3 node op util",
	processes: "boxes node places scheduler sites table util",
	realms: "api node op places processes programs protect scheduler table util", sites: "scheduler util",
	types: "node op places table util",
	build: "clingy encoding node places scheduler table", "patch-nodes": "node op places scheduler table",
	presence: "encoding node op places scheduler table",
	programs: "boxes build encoding places processes scheduler sites table types",
	subduction: "blake3 encoding node op places presence scheduler table util",
	sync: "encoding node op presence subduction table",
}
const uses = (n) => USES[n].split(" ").filter(Boolean)
const usedBy = (n) => Object.keys(USES).filter((m) => uses(m).includes(n)).sort()
const NAMES = Object.keys(PKG)
const FILL = Object.fromEntries(LAYERS.map((L) => [L.id, L.fill]))
const LAYER_ORDER = LAYERS.map((L) => L.id).reverse() // core first

const W = 1000, BW = 112, BH = 32, BAND = 112, PAD = 14

// three ways to place the boxes. each gives every package a top-left corner, and draws its own backdrop
const WAYS = {
	layers: {
		about: "where each package lives: four bands, core at the bottom",
		place() {
			const pos = {}
			LAYERS.forEach((L, i) => {
				const y = 4 + i * (BAND + 8)
				const names = L.rows[0].split(" ")
				const gap = (W - 8 - 2 * PAD - BW * names.length) / Math.max(1, names.length - 1)
				names.forEach((n, j) => {
					pos[n] = { x: 4 + PAD + j * (BW + Math.min(gap, 40)) + (names.length < 3 ? 120 : 0), y: y + 50 }
					if (names.length >= 5) pos[n].x = 4 + PAD + j * (BW + gap)
				})
			})
			return pos
		},
		backdrop(g) {
			LAYERS.forEach((L, i) => {
				const y = 4 + i * (BAND + 8)
				el("rect", { x: 4, y, width: W - 8, height: BAND, fill: L.fill, class: "band" }, g)
				el("text", { x: 14, y: y + 16, class: "band-label" }, g).textContent = L.id
				el("text", { x: 14 + L.id.length * 8 + 14, y: y + 16, class: "band-note" }, g).textContent = L.note
			})
		},
	},
	depth: {
		about: "what stands on what: each row imports only from rows below it, except a loop (boxes ⇄ processes) shares its row",
		place() {
			const pos = {}
			const rows = depthRows()
			const widest = Math.max(...rows.map((r) => r.length))
			rows.forEach((row, d) => {
				const span = row.length * BW + (row.length - 1) * 24
				const left = 160 + ((widest * BW + (widest - 1) * 24) - span) / 2
				row.forEach((n, j) => pos[n] = { x: left + j * (BW + 24), y: (rows.length - 1 - d) * 84 + 30 })
			})
			return pos
		},
		backdrop(g) {
			const rows = depthRows()
			const widest = Math.max(...rows.map((r) => r.length))
			const right = 160 + widest * BW + (widest - 1) * 24
			rows.forEach((_, d) => {
				const y = (rows.length - 1 - d) * 84 + 30 + BH / 2
				el("line", { x1: 0, x2: right, y1: y, y2: y, class: "rule" }, g)
				el("text", { x: 0, y: y - 6, class: "band-label" }, g).textContent = d ? `${d} · on top of ${d - 1}` : "0 · imports nothing"
			})
		},
	},
	loose: {
		about: "who pulls on whom: imports are springs, every box pushes the others away",
		place: settle,
		backdrop() {},
	},
}

// a package's depth: 0 if it imports nothing, else one more than the deepest thing it imports.
// packages that import each other (boxes and processes do) are one loop and share a row
function depthRows() {
	const reach = (a) => {
		const seen = new Set(), todo = [a]
		while (todo.length) for (const b of uses(todo.pop())) if (!seen.has(b)) { seen.add(b); todo.push(b) }
		return seen
	}
	const reaches = Object.fromEntries(NAMES.map((n) => [n, reach(n)]))
	const loop = (n) => NAMES.filter((m) => m === n || (reaches[n].has(m) && reaches[m].has(n)))
	const depth = {}
	const of = (n) => {
		if (n in depth) return depth[n]
		const mine = loop(n), below = mine.flatMap(uses).filter((m) => !mine.includes(m))
		const d = below.length ? 1 + Math.max(...below.map(of)) : 0
		for (const m of mine) depth[m] = d
		return d
	}
	const rows = []
	for (const n of NAMES) (rows[of(n)] ??= []).push(n)
	const rank = (n) => LAYER_ORDER.indexOf(PKG[n][0])
	for (const row of rows) row.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
	return rows
}

// springs along imports, a push between every pair (Fruchterman–Reingold), then boxes nudged until
// none overlap; the same start every time, so the same picture every time
function settle() {
	const p = NAMES.map((n, i) => {
		const a = (i / NAMES.length) * Math.PI * 2
		return { n, x: Math.cos(a) * 300, y: Math.sin(a) * 300 }
	})
	const at = Object.fromEntries(p.map((q) => [q.n, q]))
	const springs = NAMES.flatMap((a) => uses(a).map((b) => [at[a], at[b]]))
	const K = 130, STEPS = 400
	for (let step = 0; step < STEPS; step++) {
		const heat = 60 * (1 - step / STEPS) + 1
		for (const q of p) q.dx = q.dy = 0
		for (const a of p) for (const b of p) {
			if (a === b) continue
			const x = a.x - b.x, y = a.y - b.y, d = Math.max(Math.hypot(x, y), 1), f = (K * K) / d
			a.dx += (x / d) * f; a.dy += (y / d) * f
		}
		for (const [a, b] of springs) {
			const x = a.x - b.x, y = a.y - b.y, d = Math.max(Math.hypot(x, y), 1), f = (d * d) / K
			a.dx -= (x / d) * f; a.dy -= (y / d) * f
			b.dx += (x / d) * f; b.dy += (y / d) * f
		}
		for (const q of p) {
			const m = Math.max(Math.hypot(q.dx, q.dy), 1), s = Math.min(m, heat) / m
			q.x += q.dx * s; q.y += q.dy * s
		}
	}
	for (let round = 0; round < 80; round++) {
		let moved = false
		for (const a of p) for (const b of p) {
			if (a.n >= b.n) continue
			const ox = BW + 16 - Math.abs(a.x - b.x), oy = BH + 16 - Math.abs(a.y - b.y)
			if (ox <= 0 || oy <= 0) continue
			moved = true
			if (ox < oy * 2) { const s = (a.x < b.x ? -1 : 1) * ox / 2; a.x += s; b.x -= s }
			else { const s = (a.y < b.y ? -1 : 1) * oy / 2; a.y += s; b.y -= s }
		}
		if (!moved) break
	}
	return Object.fromEntries(p.map((q) => [q.n, { x: q.x - BW / 2, y: q.y - BH / 2 }]))
}

const svg = document.getElementById("svg")
const NS = "http://www.w3.org/2000/svg"
const el = (tag, attrs = {}, parent = svg) => {
	const e = document.createElementNS(NS, tag)
	for (const k in attrs) e.setAttribute(k, attrs[k])
	parent.append(e)
	return e
}
const world = el("g"), backdrop = el("g", {}, world), edges = el("g", {}, world), nodes = el("g", {}, world)

// where things are now, and per way where they have been put (dragging writes here)
let way = "layers", picked = null, lit = null
const placed = {}
const pos = {}
let cam = { x: 0, y: 0, k: 1 }

const edgeEls = []
for (const a of NAMES) for (const b of uses(a)) edgeEls.push({ a, b, e: el("path", { class: "edge" }, edges) })

const nodeEls = {}
for (const n of NAMES) {
	const g = el("g", { class: "node", tabindex: 0, role: "button", "aria-label": n }, nodes)
	el("rect", { class: "box", width: BW, height: BH }, g)
	el("rect", { class: "tab", width: 8, height: BH, fill: FILL[PKG[n][0]] }, g)
	el("text", { x: BW / 2 + 4, y: BH / 2 }, g).textContent = n
	nodeEls[n] = g
	g.addEventListener("pointerenter", () => { if (!dragging) light(n) })
	g.addEventListener("pointerleave", () => { if (!dragging) light(picked) })
	g.addEventListener("pointerdown", (ev) => grab(ev, n))
	g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(n) } })
}

function edgePath(a, b) {
	const A = pos[a], B = pos[b]
	const ax = A.x + BW / 2, bx = B.x + BW / 2
	if (Math.abs(A.y - B.y) < BH * 1.5) {
		const top = Math.min(A.y, B.y), lift = 26 + Math.abs(ax - bx) / 14
		return `M${ax} ${A.y} C${ax} ${top - lift} ${bx} ${top - lift} ${bx} ${B.y}`
	}
	const down = B.y > A.y
	const y1 = down ? A.y + BH : A.y, y2 = down ? B.y : B.y + BH, m = (y1 + y2) / 2
	return `M${ax} ${y1} C${ax} ${m} ${bx} ${m} ${bx} ${y2}`
}
function draw() {
	world.setAttribute("transform", `translate(${cam.x} ${cam.y}) scale(${cam.k})`)
	for (const n of NAMES) nodeEls[n].setAttribute("transform", `translate(${pos[n].x} ${pos[n].y})`)
	for (const { a, b, e } of edgeEls) e.setAttribute("d", edgePath(a, b))
}

// the camera that shows every box (and the backdrop) with a margin
function fitted(p = pos) {
	const box = backdrop.getBBox()
	let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
	for (const n of NAMES) { x0 = Math.min(x0, p[n].x); y0 = Math.min(y0, p[n].y - 40); x1 = Math.max(x1, p[n].x + BW); y1 = Math.max(y1, p[n].y + BH) }
	if (box.width) { x0 = Math.min(x0, box.x); y0 = Math.min(y0, box.y); x1 = Math.max(x1, box.x + box.width); y1 = Math.max(y1, box.y + box.height) }
	const r = svg.getBoundingClientRect(), m = 16
	const k = Math.min(1.4, (r.width - 2 * m) / (x1 - x0), (r.height - 2 * m - 18) / (y1 - y0))
	return { k, x: (r.width - (x1 - x0) * k) / 2 - x0 * k, y: m - y0 * k }
}

// slide boxes and camera together to where they are going; only on a press, never on its own
let anim = 0
function glide(to, cto) {
	cancelAnimationFrame(anim)
	const from = Object.fromEntries(NAMES.map((n) => [n, { ...pos[n] }])), cfrom = { ...cam }
	const t0 = performance.now(), T = 260
	const step = (now) => {
		const t = Math.min(1, (now - t0) / T), e = 1 - (1 - t) ** 3
		for (const n of NAMES) pos[n] = { x: from[n].x + (to[n].x - from[n].x) * e, y: from[n].y + (to[n].y - from[n].y) * e }
		cam = { x: cfrom.x + (cto.x - cfrom.x) * e, y: cfrom.y + (cto.y - cfrom.y) * e, k: cfrom.k + (cto.k - cfrom.k) * e }
		draw()
		if (t < 1) anim = requestAnimationFrame(step)
	}
	anim = requestAnimationFrame(step)
}

function see(w, { now = false } = {}) {
	way = w
	for (const b of document.querySelectorAll("[data-way]")) b.setAttribute("aria-pressed", b.dataset.way === w)
	placed[w] ??= WAYS[w].place()
	backdrop.replaceChildren()
	WAYS[w].backdrop(backdrop)
	const to = placed[w]
	if (now) { Object.assign(pos, structuredClone(to)); cam = fitted(); draw() }
	else glide(to, fitted(to))
	remember()
	if (!picked) about()
}

// a press on a box: a drag moves it (in this way only); a press without moving picks it
let dragging = null
function grab(ev, n) {
	ev.stopPropagation()
	cancelAnimationFrame(anim)
	const g = nodeEls[n], sx = ev.clientX, sy = ev.clientY, start = { ...pos[n] }
	let moved = false
	g.setPointerCapture(ev.pointerId)
	const move = (e) => {
		const dx = (e.clientX - sx) / cam.k, dy = (e.clientY - sy) / cam.k
		if (!moved && Math.hypot(dx, dy) * cam.k < 4) return
		moved = true; dragging = n; g.classList.add("dragging")
		pos[n] = placed[way][n] = { x: start.x + dx, y: start.y + dy }
		draw()
	}
	const up = () => {
		g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); g.removeEventListener("pointercancel", up)
		g.classList.remove("dragging"); dragging = null
		if (!moved) pick(n)
	}
	g.addEventListener("pointermove", move); g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up)
}

// a press on the paper: a drag pans; a press without moving lets go of the pick
svg.addEventListener("pointerdown", (ev) => {
	cancelAnimationFrame(anim)
	const sx = ev.clientX, sy = ev.clientY, c = { ...cam }
	let moved = false
	svg.setPointerCapture(ev.pointerId)
	const move = (e) => {
		if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 4) return
		moved = true; svg.classList.add("panning")
		cam = { ...c, x: c.x + e.clientX - sx, y: c.y + e.clientY - sy }
		draw()
	}
	const up = () => {
		svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up); svg.removeEventListener("pointercancel", up)
		svg.classList.remove("panning")
		if (!moved) pick(null)
	}
	svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up)
})
// pinch or ctrl+scroll zooms about the pointer; a plain scroll pans
svg.addEventListener("wheel", (ev) => {
	ev.preventDefault()
	cancelAnimationFrame(anim)
	if (ev.ctrlKey || ev.metaKey) {
		const r = svg.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top
		const k = Math.min(4, Math.max(0.2, cam.k * Math.exp(-ev.deltaY * 0.01)))
		cam = { k, x: px - (px - cam.x) * (k / cam.k), y: py - (py - cam.y) * (k / cam.k) }
	} else cam = { ...cam, x: cam.x - ev.deltaX, y: cam.y - ev.deltaY }
	draw()
}, { passive: false })

const diagram = document.querySelector(".diagram")
const keyU = document.querySelector(".key .u"), keyB = document.querySelector(".key .b")
// lines show only for one package: the hovered one, else the picked one
function light(n) {
	lit = n
	svg.classList.toggle("has-pick", !!n)
	diagram.classList.toggle("has-key", !!n)
	const u = n ? uses(n) : [], b = n ? usedBy(n) : []
	for (const k in nodeEls) nodeEls[k].setAttribute("class", "node" + (k === n ? " pick" : u.includes(k) ? " uses" : b.includes(k) ? " usedby" : ""))
	for (const { a, b: to, e } of edgeEls) e.setAttribute("class", "edge" + (a === n ? " uses" : to === n ? " usedby" : ""))
	keyU.textContent = `■ ${n} imports`
	keyB.textContent = `■ imports ${n}`
}

const info = document.getElementById("info")
const PINK = `<i style="background:var(--pink);border-color:var(--cherry)"></i>`
const SKY = `<i style="background:var(--sky);border-color:var(--blue)"></i>`
function chips(list, cls) {
	if (!list.length) return `<span class="none">nothing</span>`
	return `<div class="chips">${list.map((n) => `<span class="chip ${cls}" data-n="${n}" tabindex="0">${n}</span>`).join("")}</div>`
}
function about() {
	const total = Object.values(USES).reduce((s, v) => s + v.split(" ").filter(Boolean).length, 0)
	info.innerHTML = `<h1>ermine</h1>
		<p>${NAMES.length} packages in four layers, ${total} imports between them. imports mostly point down; api and realms are the ones that reach up into extensions. point at a package to see its lines; click to keep them.</p>
		<p>core is a table, a scheduler and the shape of a change. everything else is a package on top of that: places make paths, processes live at paths, sync is one more package.</p>
		<h2>ways to see them</h2>
		<dl>${Object.entries(WAYS).map(([w, W]) => `<dt>${w}${w === way ? " ←" : ""}</dt><dd>${W.about}</dd>`).join("")}</dl>
		<h2>try</h2><div class="chips">${["scheduler", "places", "api", "sync"].map((x) => `<span class="chip" data-n="${x}" tabindex="0">${x}</span>`).join("")}</div>`
}
function pick(n) {
	picked = n
	light(n)
	remember()
	if (!n) return about()
	const [layer, what] = PKG[n], u = uses(n), b = usedBy(n)
	info.innerHTML = `<div class="layer"><i style="background:${FILL[layer]}"></i>${layer}</div><h1>${n}</h1><p>${what}</p>
		<h2>${PINK}${n} imports (${u.length})</h2>${chips(u, "u")}
		<h2>${SKY}imports ${n} (${b.length})</h2>${chips(b, "b")}
		<h2>source</h2><a href="https://github.com/chee/ermine/tree/main/${layer}/${n}">${layer}/${n}</a>`
}
// the address keeps the way and the pick: #depth/scheduler
function remember() {
	history.replaceState(null, "", `#${way}${picked ? `/${picked}` : ""}`)
}

info.addEventListener("click", (ev) => { const c = ev.target.closest("[data-n]"); if (c) pick(c.dataset.n) })
info.addEventListener("keydown", (ev) => { const c = ev.target.closest("[data-n]"); if (c && ev.key === "Enter") pick(c.dataset.n) })
for (const b of document.querySelectorAll("[data-way]")) b.addEventListener("click", () => see(b.dataset.way))
// fit puts back what was dragged in this way, too
document.getElementById("fit").addEventListener("click", () => fit())
function fit() {
	const to = placed[way] = WAYS[way].place()
	glide(to, fitted(to))
}
const panel = document.getElementById("panel")
panel.addEventListener("click", () => {
	const shown = document.querySelector("main").classList.toggle("bare") === false
	panel.setAttribute("aria-pressed", shown)
})
addEventListener("keydown", (ev) => {
	if (ev.target.closest?.("input, textarea")) return
	if (ev.key === "Escape") pick(null)
	else if (ev.key === "f") fit()
	else if (ev.key === "1") see("layers")
	else if (ev.key === "2") see("depth")
	else if (ev.key === "3") see("loose")
})

const [w0, n0] = location.hash.slice(1).split("/")
const startWay = w0 in WAYS ? w0 : "layers", startPick = w0 in PKG ? w0 : n0 in PKG ? n0 : null
see(startWay, { now: true })
pick(startPick)
</script>
