<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inside a node</title>
<meta name="description" content="what a node is made of: entries in tables, one id across them. step through and poke it.">
<link rel="icon" href="../pictures/ermine.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
<style>
:root {
	--page: #ff8;
	--ink: #000;
	--paper: #fff;
	--cherry: #ff2284;
	--stem: #40dcba;
	--blue: #2269ff;
	--pink: #ffdcea;
	--sky: #dce6ff;
	--mint: #ccf5e8;
	--lemon: #fff8c8;
	--lilac: #ece2ff;
	--grey: #666;
	--mono: Monaco, "Lifesender Mono", ui-monospace, Menlo, monospace;
	font-family: Jost, system-ui, sans-serif;
	font-size: 16px;
	line-height: 1.4;
	color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); height: 100vh; display: flex; flex-direction: column; }
header {
	display: flex; align-items: center; gap: 12px; padding: 0.4em 16px;
	background: var(--ink); color: var(--paper);
}
header a { color: var(--paper); text-decoration: none; }
header a:hover { text-decoration: underline; text-decoration-color: var(--cherry); }
header .name { font-weight: 600; }
header .title { margin-right: auto; }
header button {
	font: 13px var(--mono); background: var(--ink); color: var(--paper); border: 1px solid var(--paper);
	padding: 1px 8px; cursor: pointer;
}
header button[aria-pressed="false"] { opacity: .5; }
header button:hover { border-color: var(--cherry); }
header .count { font: 13px var(--mono); min-width: 4em; text-align: center; }
main {
	flex: 1; min-height: 0; display: grid; gap: 4px; padding: 4px;
	grid-template-columns: 13rem minmax(0, 1fr) 24rem;
}
main.no-steps { grid-template-columns: minmax(0, 1fr) 24rem; }
main.no-side { grid-template-columns: 13rem minmax(0, 1fr); }
main.no-steps.no-side { grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--paper); border: 1px solid var(--ink); min-height: 0; overflow: auto; }
.hidden { display: none !important; }

/* steps */
#steps ol { list-style: none; margin: 0; padding: 4px; counter-reset: s; }
#steps li {
	counter-increment: s; padding: 4px 8px; cursor: pointer; border: 1px solid transparent;
	font-size: .95rem; display: flex; gap: 8px;
}
#steps li::before { content: counter(s); font: 12px var(--mono); color: var(--grey); width: 1.2em; padding-top: 3px; }
#steps li:hover { background: var(--lemon); }
#steps li.on { background: var(--ink); color: var(--paper); }
#steps li.on::before { color: var(--paper); }
#steps .model {
	margin: 8px; padding: 8px; font-size: .8rem; color: #333; border-top: 1px solid var(--ink);
}

/* stage */
#stage { display: flex; flex-direction: column; gap: 4px; min-height: 0; background: none; border: none; overflow: hidden; }
#stage > .panel { flex: none; }
#stage > #board { flex: 1; }
#board { flex: 1; padding: 12px; }
#board h2, #side h2 {
	font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px;
}
#board h2 .note { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--grey); }
#board section + section { margin-top: 16px; }
table.grid { border-collapse: collapse; font: 12px var(--mono); }
table.grid th, table.grid td { border: 1px solid var(--ink); padding: 0; }
table.grid thead th { background: var(--ink); color: var(--paper); padding: 4px 10px; font-weight: 600; text-align: left; }
table.grid thead th.corner { background: var(--paper); color: var(--grey); font-weight: 400; }
table.grid tbody th { background: var(--lemon); padding: 4px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
table.grid tbody tr.lit th { background: var(--ink); color: var(--paper); }
td.cell { width: 11.5rem; height: 3.6rem; vertical-align: top; cursor: pointer; }
td.cell:hover { background: var(--lemon); }
td.cell .in { padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; height: 100%; }
td.cell .tag { display: flex; justify-content: space-between; gap: 6px; }
td.cell .e { font-weight: 700; }
td.cell .when { color: var(--grey); }
td.cell .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 10.5rem; }
td.cell.empty { color: #bbb; text-align: center; vertical-align: middle; }
td.cell.lit { outline: 3px solid var(--cherry); outline-offset: -3px; background: var(--pink); }
td.cell.picked { outline: 3px solid var(--blue); outline-offset: -3px; background: var(--sky); }
td.cell.lit.picked { outline-color: var(--cherry); }
td.cell.shared .e { background: var(--stem); padding: 0 3px; }
.empty-table { font: 12px var(--mono); color: var(--grey); padding: 16px; border: 1px dashed var(--ink); background: var(--paper); }

.tray { display: flex; flex-wrap: wrap; gap: 4px; }
.loose {
	font: 12px var(--mono); border: 1px solid var(--ink); padding: 4px 8px; background: var(--paper);
	cursor: pointer; max-width: 16rem;
}
.loose.picked { background: var(--sky); outline: 3px solid var(--blue); outline-offset: -3px; }
.loose .e { font-weight: 700; margin-right: 6px; }

.tree { font: 13px var(--mono); }
.tree ul { list-style: none; margin: 0; padding-left: 1.4em; border-left: 1px solid #bbb; }
.tree > ul { padding-left: 0; border: none; }
.tree li { padding: 1px 0; }
.tree .nm { font-weight: 700; }
.tree .id { color: var(--grey); }
.tree .lit { background: var(--pink); outline: 2px solid var(--cherry); }

.index { display: grid; grid-template-columns: max-content max-content; gap: 4px 16px; font: 12px var(--mono); }
.index div { padding: 2px 0; }

/* log */
#log { height: 9.5rem; padding: 6px 10px; font: 12px var(--mono); }
#log .row { display: flex; gap: 10px; padding: 1px 0; }
#log .row .what { flex: 1; }
#log .row .ev { color: var(--cherry); }
#log .row .none { color: var(--grey); }
#log .row.err .what { color: var(--cherry); font-weight: 700; }
#log .row:first-child { background: var(--lemon); }

/* side */
#side { padding: 12px 14px; }
#side h1 { font-size: 1.35rem; margin: 0 0 .3em; line-height: 1.2; }
#side p { margin: .5em 0; }
#side code, #side .m { font: 13px var(--mono); background: var(--lemon); padding: 0 3px; }
#side .say { border-left: 3px solid var(--stem); padding-left: 10px; }
.poke { margin-top: 14px; border: 1px solid var(--ink); padding: 10px; background: var(--mint); }
.poke h2 { margin-bottom: 8px !important; }
.poke .line { display: flex; gap: 4px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.poke label { font: 12px var(--mono); }
.poke input, .poke select {
	font: 13px var(--mono); border: 1px solid var(--ink); padding: 2px 5px; background: var(--paper); min-width: 0;
}
.poke input { width: 7.5em; }
.poke input.wide { width: 15em; }
.poke button, .nav button {
	font: 600 13px var(--mono); border: 1px solid var(--ink); background: var(--paper); padding: 2px 9px; cursor: pointer;
}
.poke button:hover, .nav button:hover { background: var(--lemon); }
.poke button.go { background: var(--ink); color: var(--paper); }
.poke button.go:hover { background: var(--cherry); }
.poke .hint { font-size: .85rem; color: #333; margin: 6px 0 0; }
.answer { margin-top: 8px; font: 12px var(--mono); white-space: pre-wrap; background: var(--paper); border: 1px solid var(--ink); padding: 6px; }
.answer.err { border-color: var(--cherry); color: var(--cherry); }
.inspect { margin-top: 14px; }
.inspect pre {
	font: 12px var(--mono); background: var(--paper); border: 1px solid var(--ink); padding: 6px; margin: 0;
	white-space: pre-wrap; word-break: break-word; max-height: 22rem; overflow: auto;
}
.inspect .who { font: 12px var(--mono); margin: 4px 0; }
.nav { display: flex; gap: 4px; margin-top: 14px; }
.nav .grow { flex: 1; }
.true { font-size: .8rem; color: #333; margin-top: 14px; border-top: 1px solid var(--ink); padding-top: 6px; }
@media (max-width: 1000px) { main, main.no-steps, main.no-side { grid-template-columns: 1fr; } }
</style>
<header>
	<a class="name" href="../">🐰 ermine demos</a>
	<a href="../book/">the book</a>
	<span class="title"><b style="font:13px var(--mono);color:var(--cherry);margin-right:6px">1</b>inside a node</span>
	<button id="t-steps" aria-pressed="true" title="show or hide the steps">steps</button>
	<button id="t-log" aria-pressed="true" title="show or hide the log">log</button>
	<button id="t-side" aria-pressed="true" title="show or hide the notes">notes</button>
	<button id="prev" title="back a step (←)">←</button>
	<span class="count" id="count"></span>
	<button id="next" title="on a step (→)">→</button>
</header>
<main id="main">
	<nav class="panel" id="steps" aria-label="steps"><ol id="steplist"></ol>
		<p class="model">Everything here runs in this page: small copies of ermine's table, entry and update,
		written to match core/table and core/node. Writes only do puts and removals on maps.</p>
	</nav>
	<div id="stage">
		<div class="panel" id="board"></div>
		<div class="panel" id="log" aria-live="polite"></div>
	</div>
	<aside class="panel" id="side"></aside>
</main>
<script>
// ---------------------------------------------------------------------------------------------
// the model. a small copy of core/table/typescript/table.ts, core/node/typescript/entry.ts,
// node.ts and update.ts. update's apply here only does puts and removals on maps (op's does
// strings, lists, ranges, moves and more). nothing here is imported: the core is typescript with
// bare specifiers, which a browser can't load as is

class TableError extends Error {
	constructor(code, part, id) {
		super([code, part, id].filter((x) => x !== undefined).join(" "))
		this.code = code
	}
}

// createTable: (table name, id) → entry, and entry → table name → ids. one listener, told after
// each add, sub or del lands; the same entry again is nothing, and no event
function createTable(event) {
	const at = new Map(), where = new Map()
	function put(part, id, node) {
		let parts = at.get(id)
		if (!parts) at.set(id, parts = new Map())
		parts.set(part, node)
		let ids = where.get(node)
		if (!ids) where.set(node, ids = new Map())
		let set = ids.get(part)
		if (!set) ids.set(part, set = new Set())
		set.add(id)
	}
	function take(part, id, node) {
		const parts = at.get(id)
		parts.delete(part)
		if (parts.size === 0) at.delete(id)
		const ids = where.get(node), set = ids.get(part)
		set.delete(id)
		if (set.size === 0) ids.delete(part)
		if (ids.size === 0) where.delete(node)
	}
	function add(part, id, node) {
		const there = at.get(id)?.get(part)
		if (there === node) return
		if (there !== undefined) throw new TableError("already-there", part, id)
		put(part, id, node)
		event?.(part, id)
	}
	function sub(part, id, node) {
		const there = at.get(id)?.get(part)
		if (there === node) return
		if (there !== undefined) take(part, id, there)
		put(part, id, node)
		event?.(part, id)
	}
	function get(a, b) {
		if (arguments.length === 1) return [...at.get(a) ?? []]
		if (typeof b === "object") return [...where.get(b)?.get(a) ?? []]
		return at.get(b)?.get(a)
	}
	function who(node) {
		const out = []
		for (const [part, ids] of where.get(node) ?? []) for (const id of ids) out.push([part, id])
		return out
	}
	function del(a, b) {
		if (typeof a === "object") {
			const keys = who(a)
			if (keys.length === 0) throw new TableError("nothing-there")
			for (const [part, id] of keys) take(part, id, a)
			if (event) for (const [part, id] of keys) event(part, id)
		} else if (typeof b === "object") {
			const ids = get(a, b)
			if (ids.length === 0) throw new TableError("nothing-there", a)
			for (const id of ids) take(a, id, b)
			if (event) for (const id of ids) event(a, id)
		} else {
			const there = at.get(b)?.get(a)
			if (there === undefined) throw new TableError("nothing-there", a, b)
			take(a, b, there)
			event?.(a, b)
		}
	}
	// for drawing only: the real table has no way to list every id
	const peek = () => ({ at, where })
	return { add, sub, get, who, del, peek }
}

const now = () => Math.floor(Date.now() / 1000)

// createEntry: a value and its latest change. no id: where it's kept is a layer above's
function createEntry(value, change = {}) {
	if (change.time === undefined) change = { ...change, time: now() }
	const entry = { change }
	if (value !== undefined) entry.value = value
	return entry
}

// createNode: each table's plain value made an entry, one change shared by all
function createNode(values, change = {}) {
	if (change.time === undefined) change = { ...change, time: now() }
	const node = {}
	for (const table of Object.keys(values)) {
		if (values[table] === undefined) continue
		node[table] = createEntry(values[table], change)
	}
	return node
}

class OpError extends Error {
	constructor(code, patch) { super(`${code} (patch ${patch})`); this.code = code; this.patch = patch }
}
const isMap = (v) => v !== null && typeof v === "object" && !Array.isArray(v)

// puts and removals on maps, on a copy: a throw leaves the value given as it was. the undo, built
// as each patch lands, last patch's first
function apply(value, patches) {
	let root = structuredClone(value)
	const undo = []
	patches.forEach((p, i) => {
		if (!Array.isArray(p?.path)) throw new OpError("not-a-patch", i)
		const putting = "value" in p
		if (p.path.length === 0) {
			undo.unshift(root === undefined ? { path: [] } : { path: [], value: root })
			root = putting ? structuredClone(p.value) : undefined
			return
		}
		let parent = root
		for (const k of p.path.slice(0, -1)) {
			if (!isMap(parent) || !Object.hasOwn(parent, k)) throw new OpError("no-key", i)
			parent = parent[k]
		}
		if (parent === undefined) throw new OpError("no-key", i)
		if (!isMap(parent)) throw new OpError("wrong-kind", i)
		const k = p.path.at(-1), had = Object.hasOwn(parent, k)
		if (putting) {
			undo.unshift(had ? { path: p.path, value: parent[k] } : { path: p.path })
			parent[k] = structuredClone(p.value)
		} else if (had) {
			undo.unshift({ path: p.path, value: parent[k] })
			delete parent[k]
		}
	})
	return { after: root, undo }
}

// update: the entry's value changed, its change replaced by the header given with the patches and
// their undo. the table is not told: it holds the same entry
function update(entry, patches, change) {
	const { after, undo } = apply(entry.value, patches)
	if (after === undefined) delete entry.value
	else entry.value = after
	entry.change = { ...change, op: { patches, undo } }
}

// places' place: an id under a name in a children entry, as an update on it. names "", ".", ".."
// and "/" refused; a name holding anything refused
class PlacesError extends Error {
	constructor(code, name) { super(`${code} ${JSON.stringify(name)}`); this.code = code }
}
function place(children, name, id, header) {
	if (name === "" || name === "." || name === ".." || name === "/") throw new PlacesError("not-a-name", name)
	if (isMap(children.value) && Object.hasOwn(children.value, name)) throw new PlacesError("already-there", name)
	update(children, [...(isMap(children.value) ? [] : [{ path: [], value: {} }]), { path: [name], value: id }], header)
}
const child = (children, name) => {
	const v = children?.value
	return isMap(v) && Object.hasOwn(v, name) && typeof v[name] === "string" ? v[name] : undefined
}

// ---------------------------------------------------------------------------------------------
// the page's world: one table, a log, names for entries, what is lit and picked

let W
function fresh() {
	const w = { events: [], log: [], names: new WeakMap(), count: 0, loose: [], lit: new Set(), litRows: new Set(), litTree: new Set(), picked: null, answer: null }
	w.table = createTable((part, id) => w.events.push([part, id]))
	return w
}
const label = (e) => {
	if (!W.names.has(e)) W.names.set(e, "e" + (++W.count))
	return W.names.get(e)
}
const keyOf = (part, id) => part + "\u0000" + id

// where in this page's code a write came from, as places' header captures a site with stacktrace
function site() {
	const lines = (new Error().stack ?? "").split("\n").slice(1)
	for (const l of lines) {
		const m = l.match(/at (?:(\S+) \()?.*?([^/\s(]+\.html):(\d+):(\d+)\)?$/)
		if (m && m[1] !== "site" && m[1] !== "header") return { file: m[2], line: +m[3], column: +m[4], ...(m[1] ? { function: m[1] } : {}) }
	}
	return undefined
}
function header(extra = {}) {
	const s = site()
	return { time: now(), actor: "you", ...(s ? { external: [s] } : {}), ...extra }
}

// run a table call: log it with the events it caused, light what it touched
function act(text, f, { quiet } = {}) {
	W.lit.clear(); W.litRows.clear(); W.litTree.clear(); W.answer = null
	const before = W.events.length
	try {
		const out = f()
		const evs = W.events.slice(before)
		for (const [p, i] of evs) W.lit.add(keyOf(p, i))
		W.log.unshift({ what: text, events: evs, quiet })
		return out
	} catch (e) {
		W.log.unshift({ what: text, error: e.code ?? e.message })
		W.answer = { err: true, text: `refused: ${e.code ?? e.message}${e.code === "already-there" ? "\na different entry is already in that cell" : e.code === "no-key" ? "\nthe path goes through a key that isn't there. nothing changed" : e.code === "nothing-there" ? "\nnothing is there to take out" : ""}` }
		return undefined
	}
}

// parse what's typed: JSON if it reads as JSON, else the text as a string
function parse(s) {
	try { return JSON.parse(s) } catch { return s }
}
const show = (v) => v === undefined ? "nothing" : JSON.stringify(v)

// ---------------------------------------------------------------------------------------------
// the steps. each builds its world from nothing, so going back and forth is always the same

function seed({ entries = true, node = false, kids = false } = {}) {
	const t = W.table
	if (node) {
		const n = createNode({ value: { title: "shopping" }, attributes: { colour: "lemon" }, children: {} }, { time: now(), actor: "host" })
		t.add("value", "list", n.value); t.add("attributes", "list", n.attributes); t.add("children", "list", n.children)
		label(n.value); label(n.attributes); label(n.children)
	}
	if (kids) {
		const root = createNode({ children: {} }, { time: now(), actor: "host" })
		t.add("children", "root", root.children)
		const milk = createEntry("milk", { time: now(), actor: "host" })
		const eggs = createEntry("eggs", { time: now(), actor: "host" })
		t.add("value", "m1", milk); t.add("value", "g1", eggs)
		const h = { time: now(), actor: "host" }
		place(root.children, "list", "list", h)
		place(t.get("children", "list"), "milk", "m1", h)
		place(t.get("children", "list"), "eggs", "g1", h)
		label(root.children); label(milk); label(eggs)
	}
	W.events.length = 0
}

const STEPS = [
	{
		title: "an id is an address",
		say: `<p>Everything ermine holds sits at an <b>id</b>. An id is just a name for a spot, usually a string.</p>
			<p>On its own an id holds nothing. The table below is empty, so asking what's at any id gives an empty list.</p>`,
		setup() {},
		poke: () => `<h2>try</h2>
			<div class="line"><label for="p-id">id</label><input id="p-id" value="list"><button class="go" data-do="ask">what's at it?</button></div>
			<p class="hint">This calls <span class="m">table.get(id)</span>.</p>`,
		do: {
			ask() {
				const id = val("p-id")
				const out = act(`get(${show(id)})`, () => W.table.get(id))
				W.answer = { text: `get(${show(id)}) → ${JSON.stringify(out.map(([p, e]) => [p, label(e)]))}\nnothing is at it yet` }
			},
		},
	},
	{
		title: "an entry: a value and its change",
		say: `<p>The smallest thing ermine keeps is an <b>entry</b>: a <b>value</b>, and the <b>change</b> that last made it.</p>
			<p>The change says when (<span class="m">time</span>, whole seconds), who (<span class="m">actor</span>), and where in code the write came from (<span class="m">external</span>). It can carry other notes too, in <span class="m">metadata</span>.</p>
			<p>An entry has no id. It sits in the tray, not in the table, until something puts it there.</p>`,
		setup() {},
		poke: () => `<h2>make an entry</h2>
			<div class="line"><label for="p-v">value</label><input id="p-v" class="wide" value='{"title": "shopping"}'></div>
			<div class="line"><button class="go" data-do="make">createEntry</button></div>
			<p class="hint">Plain text or JSON. Click an entry in the tray to see all of it.</p>`,
		do: {
			make() {
				const e = act(`createEntry(${val("p-v")})`, () => createEntry(parse(val("p-v")), header()))
				W.loose.push(e); W.picked = { entry: e }
			},
		},
		tray: true,
	},
	{
		title: "the table: a name and an id",
		say: `<p>The <b>table</b> keeps entries under two keys: a <b>table name</b> and an <b>id</b>. Here, columns are table names and rows are ids.</p>
			<p><span class="m">add</span> puts an entry in one cell. The table then tells its one listener <span class="m">[table name, id]</span>, which shows in the log.</p>
			<p>If a different entry is already in the cell, <span class="m">add</span> refuses. Adding the same entry again does nothing, and nobody is told.</p>`,
		setup() {
			W.loose.push(createEntry({ title: "shopping" }, { time: now(), actor: "host" }), createEntry({ title: "chores" }, { time: now(), actor: "host" }))
			W.loose.forEach(label)
			W.picked = { entry: W.loose[0] }
		},
		poke: () => `<h2>add the picked entry</h2>
			<div class="line"><label>entry</label><b class="m">${W.picked?.entry ? label(W.picked.entry) : "pick one in the tray"}</b></div>
			<div class="line"><label for="p-part">table</label>${partSelect()}<label for="p-id">id</label><input id="p-id" value="list"></div>
			<div class="line"><button class="go" data-do="add">add</button></div>
			<p class="hint">Add e1 at value / list. Then add it again, then try e2 in the same cell.</p>`,
		do: {
			add() {
				const e = W.picked?.entry
				if (!e) return W.answer = { err: true, text: "pick an entry first" }
				act(`add(${show(val("p-part"))}, ${show(val("p-id"))}, ${label(e)})`, () => W.table.add(val("p-part"), val("p-id"), e))
			},
		},
		tray: true,
	},
	{
		title: "a node is everything at one id",
		say: `<p>Put entries under <span class="m">value</span>, <span class="m">attributes</span> and <span class="m">children</span> at the same id and you have a <b>node</b>.</p>
			<p>A node isn't stored as one object. It's that id's whole row, and <span class="m">get(id)</span> hands the row back.</p>
			<p>Each table's entry changes on its own, so the value and the attributes each keep their own latest change.</p>
			<p><span class="m">createNode</span> is a shortcut: it makes one entry per table from plain values, all sharing one change. It doesn't put them in the table. Here the page adds each one.</p>`,
		setup() { seed({ node: true }) },
		poke: () => `<h2>make a node</h2>
			<div class="line"><label for="p-id">id</label><input id="p-id" value="chores"></div>
			<div class="line"><label for="p-v">value</label><input id="p-v" class="wide" value='{"title": "chores"}'></div>
			<div class="line"><label for="p-a">attributes</label><input id="p-a" class="wide" value='{"colour": "mint"}'></div>
			<div class="line"><label for="p-c">children</label><input id="p-c" class="wide" value='{}'></div>
			<div class="line"><button class="go" data-do="make">createNode, then add each</button><button data-do="row">get(id)</button></div>
			<p class="hint">Leave a box empty and that table is left out. A node has the tables it has.</p>`,
		do: {
			make() {
				const id = val("p-id"), values = {}
				for (const [k, f] of [["value", "p-v"], ["attributes", "p-a"], ["children", "p-c"]]) if (val(f) !== "") values[k] = parse(val(f))
				act(`createNode(…) at ${show(id)}`, () => {
					const n = createNode(values, header())
					for (const k of Object.keys(n)) { label(n[k]); W.table.add(k, id, n[k]) }
				})
			},
			row() {
				const id = val("p-id")
				const out = act(`get(${show(id)})`, () => W.table.get(id), { quiet: true })
				W.litRows.add(id)
				W.answer = { text: `get(${show(id)}) →\n` + (out.length ? out.map(([p, e]) => `  [${p}, ${label(e)}]`).join("\n") : "  []") }
			},
		},
	},
	{
		title: "writing changes the entry in place",
		say: `<p>A write is <span class="m">update(entry, patches, change)</span>. A <b>patch</b> says where (a path) and what to put there. Leave the value out and it removes instead.</p>
			<p>The value changes, and the entry's change is replaced by the new one, along with the patches and their <b>undo</b>.</p>
			<p>The table hears nothing, because the same entry is still in the same cell. Telling whoever reads it is the scheduler's job, which comes later.</p>`,
		setup() { seed({ node: true }); W.picked = { part: "value", id: "list" } },
		poke: () => `<h2>write to the picked cell</h2>
			<div class="line"><label>cell</label><b class="m">${pickedName()}</b></div>
			<div class="line"><label for="p-path">path</label><input id="p-path" value="title"><label for="p-v">value</label><input id="p-v" value='"groceries"'></div>
			<div class="line"><button class="go" data-do="put">put</button><button data-do="remove">remove</button></div>
			<p class="hint">Separate a path's keys with dots, like <span class="m">a.b</span>. Try <span class="m">due.day</span>: there's no <span class="m">due</span>, so it's refused and nothing changes.</p>`,
		do: {
			put() { write(true) },
			remove() { write(false) },
		},
	},
	{
		title: "every change carries its undo",
		say: `<p>Each change keeps the patches that would take it back. Undoing is just another <span class="m">update</span> with those patches.</p>
			<p>That undo has an undo of its own, so pressing it again brings the change back.</p>`,
		setup() {
			seed({ node: true })
			update(W.table.get("value", "list"), [{ path: ["title"], value: "groceries" }, { path: ["due"], value: "friday" }], { time: now(), actor: "host" })
			W.picked = { part: "value", id: "list" }
		},
		poke: () => {
			const e = pickedEntry()
			return `<h2>undo the picked cell's change</h2>
			<div class="line"><label>cell</label><b class="m">${pickedName()}</b></div>
			<div class="answer">undo: ${e?.change.op ? JSON.stringify(e.change.op.undo) : "this entry's change has no op yet"}</div>
			<div class="line" style="margin-top:6px"><button class="go" data-do="undo">update with the undo</button></div>`
		},
		do: {
			undo() {
				const e = pickedEntry()
				if (!e?.change.op) return W.answer = { err: true, text: "no op on this change to undo" }
				act(`update(${label(e)}, undo)`, () => update(e, e.change.op.undo, header()))
				W.lit.add(keyOf(W.picked.part, W.picked.id))
			},
		},
	},
	{
		title: "children make folders",
		say: `<p>The <span class="m">children</span> table holds a map from <b>name</b> to <b>id</b>. That's all a folder is.</p>
			<p>Putting something in a folder is an <span class="m">update</span> on the folder's children entry, one put at the name.</p>
			<p>A <b>path</b> is walked one name at a time: start at the root, then look each name up in the children of the id you're at.</p>`,
		setup() { seed({ node: true, kids: true }) },
		poke: () => `<h2>place a name</h2>
			<div class="line"><label for="p-f">in folder id</label><input id="p-f" value="list"></div>
			<div class="line"><label for="p-n">name</label><input id="p-n" value="bread"><label for="p-id">id</label><input id="p-id" value="b1"></div>
			<div class="line"><button class="go" data-do="place">make bread and place it</button></div>
			<h2 style="margin-top:12px">walk a path</h2>
			<div class="line"><label for="p-path">from root</label><input id="p-path" class="wide" value="list/milk"><button class="go" data-do="walk">walk</button></div>
			<p class="hint">Names "", ".", ".." and "/" are refused, and so is a name that's already taken. The real walk in places does more (boxes, caches, more than one source of names). This is just the core of it.</p>`,
		do: {
			place() {
				const f = val("p-f"), n = val("p-n"), id = val("p-id")
				act(`add value ${show(id)}; place ${show(n)} in ${show(f)}`, () => {
					const kids = W.table.get("children", f)
					if (!kids) throw new PlacesError("nothing-there", f + " has no children entry")
					place(kids, n, id, header())
					if (!W.table.get("value", id)) { const e = createEntry(n, header()); label(e); W.table.add("value", id, e) }
					W.lit.add(keyOf("children", f))
				})
			},
			walk() {
				const names = val("p-path").split("/").filter((x) => x !== "")
				W.lit.clear(); W.litRows.clear(); W.litTree.clear()
				let at = "root"
				const route = [`root`]
				W.litRows.add("root")
				for (const n of names) {
					W.lit.add(keyOf("children", at))
					const next = child(W.table.get("children", at), n)
					if (next === undefined) { route.push(`${n} → nothing there`); at = undefined; break }
					route.push(`${n} → ${next}`)
					at = next; W.litRows.add(at); W.litTree.add(at)
				}
				W.log.unshift({ what: `walk /${names.join("/")}`, events: [], quiet: true })
				W.answer = { text: route.join("\n") + (at !== undefined ? `\n\nvalue at ${at}: ${show(W.table.get("value", at)?.value)}` : "") }
			},
		},
		tree: true,
	},
	{
		title: "one entry, many keys",
		say: `<p>One entry can sit in more than one cell. Put the same value entry at two ids and a write to it shows up in both rows, because it's one thing.</p>
			<p>The table also keeps a second index, from entry to its keys, so <span class="m">who(entry)</span> answers without searching. Shared entries are marked in green.</p>
			<p><span class="m">sub</span> swaps whatever is in a cell. <span class="m">del(entry)</span> takes the entry out of every cell it's in.</p>`,
		setup() {
			seed({ node: true })
			W.table.add("value", "copy", W.table.get("value", "list")); W.events.length = 0
			W.picked = { part: "value", id: "list" }
		},
		poke: () => `<h2>the picked cell's entry</h2>
			<div class="line"><label>cell</label><b class="m">${pickedName()}</b></div>
			<div class="line"><label for="p-part">table</label>${partSelect()}<label for="p-id">id</label><input id="p-id" value="third"></div>
			<div class="line"><button class="go" data-do="add">add it there too</button><button data-do="sub">sub it in</button></div>
			<div class="line"><button data-do="who">who(entry)</button><button data-do="del">del(entry)</button><button data-do="put">put done = true</button></div>`,
		do: {
			add() { const e = pickedEntry(); if (e) act(`add(${show(val("p-part"))}, ${show(val("p-id"))}, ${label(e)})`, () => W.table.add(val("p-part"), val("p-id"), e)) },
			sub() { const e = pickedEntry(); if (e) act(`sub(${show(val("p-part"))}, ${show(val("p-id"))}, ${label(e)})`, () => W.table.sub(val("p-part"), val("p-id"), e)) },
			who() {
				const e = pickedEntry(); if (!e) return
				const keys = act(`who(${label(e)})`, () => W.table.who(e), { quiet: true })
				for (const [p, i] of keys) W.lit.add(keyOf(p, i))
				W.answer = { text: `who(${label(e)}) → ${JSON.stringify(keys)}` }
			},
			del() { const e = pickedEntry(); if (e) { act(`del(${label(e)})`, () => W.table.del(e)); W.picked = null } },
			put() {
				const e = pickedEntry(); if (!e) return
				act(`update(${label(e)}, done = true)`, () => update(e, [{ path: ["done"], value: true }], header()))
				for (const [p, i] of W.table.who(e)) W.lit.add(keyOf(p, i))
			},
		},
		index: true,
	},
	{
		title: "any name is a table",
		say: `<p><span class="m">value</span>, <span class="m">attributes</span> and <span class="m">children</span> are only the three that ermine's core names. The table checks no name and no shape.</p>
			<p>Other packages add their own tables at the same ids: <span class="m">patch</span> (patch-nodes), <span class="m">presence</span>, and <span class="m">conflicts</span>, <span class="m">ephemeral</span> and <span class="m">status</span> (sync).</p>
			<p>A package that doesn't know a table never looks at it. A reader asks for the table it knows by name.</p>`,
		setup() { seed({ node: true }) },
		poke: () => `<h2>add a table of your own</h2>
			<div class="line"><label for="p-t">table</label><input id="p-t" value="comments"><label for="p-id">id</label><input id="p-id" value="list"></div>
			<div class="line"><label for="p-v">value</label><input id="p-v" class="wide" value='["buy oat milk too"]'></div>
			<div class="line"><button class="go" data-do="add">add</button><button data-do="row">get(id)</button></div>`,
		do: {
			add() {
				const t = val("p-t").trim()
				if (!t) return W.answer = { err: true, text: "a table needs a name here (the real table would take \"\" too)" }
				act(`add(${show(t)}, ${show(val("p-id"))}, …)`, () => { const e = createEntry(parse(val("p-v")), header()); label(e); W.table.add(t, val("p-id"), e) })
			},
			row() { STEPS[3].do.row() },
		},
	},
]

function write(putting) {
	const e = pickedEntry()
	if (!e) return W.answer = { err: true, text: "pick a cell with an entry in it" }
	const path = val("p-path").split(".").filter((x) => x !== "")
	const patch = putting ? { path, value: parse(val("p-v")) } : { path }
	act(`update(${label(e)}, [${JSON.stringify(patch)}])`, () => update(e, [patch], header()))
	if (!W.answer) {
		W.lit.add(keyOf(W.picked.part, W.picked.id))
		W.answer = { text: `no table event: the table holds the same entry.\npatches: ${JSON.stringify(e.change.op.patches)}\nundo:    ${JSON.stringify(e.change.op.undo)}` }
	}
}

// ---------------------------------------------------------------------------------------------
// drawing

const $ = (id) => document.getElementById(id)
const val = (id) => $(id)?.value ?? ""
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const pickedEntry = () => W.picked?.entry ?? (W.picked ? W.table.get(W.picked.part, W.picked.id) : undefined)
const pickedName = () => W.picked?.part ? `${W.picked.part} / ${W.picked.id}${pickedEntry() ? " (" + label(pickedEntry()) + ")" : " (empty)"}` : "click a cell"
function partSelect() {
	return `<select id="p-part">${columns().map((p) => `<option>${esc(p)}</option>`).join("")}</select>`
}
function columns() {
	const cols = ["value", "attributes", "children"]
	for (const parts of W.table.peek().at.values()) for (const p of parts.keys()) if (!cols.includes(p)) cols.push(p)
	return cols
}

let step = 0
function go(n) {
	step = Math.max(0, Math.min(STEPS.length - 1, n))
	W = fresh()
	STEPS[step].setup()
	history.replaceState(null, "", "#" + (step + 1))
	draw()
}

function draw() {
	const S = STEPS[step]
	$("count").textContent = `${step + 1} / ${STEPS.length}`
	$("steplist").innerHTML = STEPS.map((s, i) => `<li class="${i === step ? "on" : ""}" data-step="${i}" tabindex="0">${esc(s.title)}</li>`).join("")
	drawBoard(S); drawLog(); drawSide(S)
}

function drawBoard(S) {
	const { at, where } = W.table.peek()
	const ids = [...at.keys()]
	const cols = columns()
	let h = ""
	if (S.tray) {
		h += `<section><h2>tray <span class="note">entries not in the table: no id</span></h2><div class="tray">` +
			(W.loose.length ? W.loose.map((e, i) => `<div class="loose ${W.picked?.entry === e ? "picked" : ""}" data-loose="${i}"><span class="e">${label(e)}</span>${esc(show(e.value))}</div>`).join("") : `<span class="empty-table">nothing made yet</span>`) +
			`</div></section>`
	}
	h += `<section><h2>the table <span class="note">columns: table names · rows: ids · each cell: one entry</span></h2>`
	if (!ids.length) h += `<div class="empty-table">empty: no id has anything at it</div>`
	else {
		h += `<table class="grid"><thead><tr><th class="corner">id ╲ table</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`
		for (const id of ids) {
			h += `<tr class="${W.litRows.has(id) ? "lit" : ""}"><th>${esc(id)}</th>`
			for (const c of cols) {
				const e = at.get(id).get(c)
				const k = keyOf(c, id)
				const cls = ["cell", W.lit.has(k) ? "lit" : "", W.picked?.part === c && W.picked?.id === id ? "picked" : ""]
				if (!e) { h += `<td class="${cls.join(" ")} empty" data-part="${esc(c)}" data-id="${esc(id)}">·</td>`; continue }
				const n = W.table.who(e).length
				if (n > 1) cls.push("shared")
				h += `<td class="${cls.join(" ")}" data-part="${esc(c)}" data-id="${esc(id)}" title="click to see the whole entry"><div class="in"><div class="tag"><span class="e">${label(e)}</span><span class="when">${esc(String(e.change.actor ?? ""))}${e.change.op ? " · written" : ""}</span></div><div class="v">${esc(show(e.value))}</div></div></td>`
			}
			h += `</tr>`
		}
		h += `</tbody></table>`
	}
	h += `</section>`
	if (S.tree && at.has("root")) {
		const seen = new Set()
		const walk = (id) => {
			if (seen.has(id)) return `<ul><li class="id">(${esc(id)} again)</li></ul>`
			seen.add(id)
			const kids = W.table.get("children", id)?.value
			if (!isMap(kids) || !Object.keys(kids).length) return ""
			return `<ul>${Object.entries(kids).map(([n, cid]) => `<li><span class="${W.litTree.has(cid) ? "lit" : ""}"><span class="nm">${esc(n)}</span> <span class="id">→ ${esc(String(cid))}</span> ${esc(show(W.table.get("value", cid)?.value))}</span>${walk(cid)}</li>`).join("")}</ul>`
		}
		h += `<section><h2>the tree <span class="note">drawn only from children cells, starting at root</span></h2><div class="tree"><ul><li><span class="nm">/</span> <span class="id">root</span>${walk("root")}</li></ul></div></section>`
	}
	if (S.index) {
		h += `<section><h2>the other index <span class="note">entry → its keys, what who() reads</span></h2><div class="index">`
		for (const [e, parts] of where) {
			const keys = [...parts].flatMap(([p, set]) => [...set].map((i) => `[${p}, ${i}]`))
			h += `<div><b>${label(e)}</b></div><div>${esc(keys.join("  "))}</div>`
		}
		h += `</div></section>`
	}
	$("board").innerHTML = h
}

function drawLog() {
	$("log").innerHTML = `<h2 style="font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px">log <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey)">newest first · pink: what the table told its listener</span></h2>` +
		(W.log.length ? W.log.map((r) => `<div class="row ${r.error ? "err" : ""}"><span class="what">${esc(r.what)}${r.error ? " → refused: " + esc(r.error) : ""}</span>${r.error ? "" : r.events.length ? `<span class="ev">told ${esc(r.events.map(([p, i]) => `[${p}, ${i}]`).join(" "))}</span>` : r.quiet ? `<span class="none">a read</span>` : `<span class="none">no table event</span>`}</div>`).join("") : `<div class="row"><span class="none">nothing yet</span></div>`)
}

function drawSide(S) {
	const e = pickedEntry()
	let h = `<h1>${esc(S.title)}</h1><div class="say">${S.say}</div><div class="poke">${S.poke()}`
	if (W.answer) h += `<div class="answer ${W.answer.err ? "err" : ""}">${esc(W.answer.text)}</div>`
	h += `</div>`
	if (e) {
		const keys = W.table.who(e)
		h += `<div class="inspect"><h2>${label(e)}, the whole entry</h2><div class="who">${keys.length ? "in the table at " + esc(keys.map(([p, i]) => `[${p}, ${i}]`).join(" ")) : "not in the table"}</div><pre>${esc(JSON.stringify(e, null, 2))}</pre></div>`
	}
	h += `<div class="nav"><button data-nav="-1" ${step === 0 ? "disabled" : ""}>← back</button><span class="grow"></span><button data-nav="0">start this step again</button>${step === STEPS.length - 1 ? `<a class="b" style="font:600 13px var(--mono);border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:2px 9px;text-decoration:none" href="../book/patches/">chapter 2: where a write lands →</a>` : `<button data-nav="1">next →</button>`}</div>`
	h += `<p class="true">Runs in this page: small copies of core/table, core/node's createEntry, createNode and update, and places' place. Writes only do puts and removals on maps; op's real apply does much more. <span class="m">external</span> is where in this page's code the write came from.</p>`
	$("side").innerHTML = h
}

// ---------------------------------------------------------------------------------------------
// wiring

document.addEventListener("click", (ev) => {
	const t = ev.target
	const d = t.closest("[data-do]")
	if (d) {
		// keep what's typed across the redraw
		const kept = {}
		for (const i of document.querySelectorAll(".poke input, .poke select")) kept[i.id] = i.value
		STEPS[step].do[d.dataset.do]()
		draw()
		for (const [id, v] of Object.entries(kept)) if ($(id)) $(id).value = v
		return
	}
	const cell = t.closest("td.cell")
	if (cell) { W.picked = { part: cell.dataset.part, id: cell.dataset.id }; W.answer = null; return redraw() }
	const loose = t.closest("[data-loose]")
	if (loose) { W.picked = { entry: W.loose[+loose.dataset.loose] }; return redraw() }
	const s = t.closest("[data-step]")
	if (s) return go(+s.dataset.step)
	const n = t.closest("[data-nav]")
	if (n) return go(step + +n.dataset.nav)
})
function redraw() {
	const kept = {}
	for (const i of document.querySelectorAll(".poke input, .poke select")) kept[i.id] = i.value
	draw()
	for (const [id, v] of Object.entries(kept)) if ($(id)) $(id).value = v
}
document.addEventListener("keydown", (ev) => {
	if (ev.target.matches("input, select")) {
		if (ev.key === "Enter") ev.target.closest(".poke")?.querySelector("button.go")?.click()
		return
	}
	if (ev.key === "ArrowRight") go(step + 1)
	if (ev.key === "ArrowLeft") go(step - 1)
	if (ev.key === "Enter" && ev.target.dataset.step) go(+ev.target.dataset.step)
})
$("prev").onclick = () => go(step - 1)
$("next").onclick = () => go(step + 1)
for (const [b, cls, el] of [["t-steps", "no-steps", "steps"], ["t-side", "no-side", "side"], ["t-log", null, "log"]]) {
	$(b).onclick = () => {
		const on = $(b).getAttribute("aria-pressed") !== "true"
		$(b).setAttribute("aria-pressed", String(on))
		$(el).classList.toggle("hidden", !on)
		if (cls) $("main").classList.toggle(cls, !on)
	}
}
const fromHash = () => (parseInt(location.hash.slice(1)) || 1) - 1
addEventListener("hashchange", () => { if (fromHash() !== step) go(fromHash()) })
go(fromHash())
</script>
