# the tests on every push and pull request: lint, formatting and types; the TypeScript tests, and
# the conformance suites against the TypeScript harnesses, the C harnesses (built with warnings as
# errors) and their sanitizer builds (address, undefined behaviour), on Linux and macOS. the
# Makefile says what each runs.

name: core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Lint
        run: deno lint
      - name: Formatting
        run: deno fmt --check
      - name: Types
        run: deno task check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: TypeScript tests and conformance
        run: make test

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Build the harnesses
        run: make -s all check WERROR=1
      - name: Conformance, C
        run: make -s test-c
      - name: Conformance, C with sanitizers
        run: make -s test-check

  # how cost grows with size (meta/conformance/perf.ts): reported, never failing the build, until its
  # sizes and perf.sadly_known_fail lists are tuned on a quiet machine
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Build the harnesses
        run: |
          make -s lib/changeable/c/apply-harness lib/changeable/c/squish-harness lib/crow/c/crow-harness \
            core/reactivity/c/scheduler-harness
      - name: Performance, TypeScript
        run: deno task perf
      - name: Performance, C
        run: deno task perf --c
