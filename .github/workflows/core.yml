# core's tests on every push: the TypeScript tests, and core's conformance suites against the
# TypeScript harnesses, the C harnesses and their sanitizer builds (address, undefined behaviour),
# on Linux and macOS.

name: core

on:
  push:
  workflow_dispatch:

env:
  SUITES: apply invert squish node update table unread tracker paths scheduler

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript tests
        run: deno test --quiet --allow-run --allow-read --allow-env core
      - name: Conformance, TypeScript
        run: deno task conformance $SUITES

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the harnesses
        run: |
          bins="core/op/c/apply-harness core/op/c/squish-harness core/node/c/node-harness
            core/node/c/update-harness core/table/c/table-harness core/unread/c/unread-harness
            core/scheduler/c/tracker-harness core/scheduler/c/paths-harness
            core/scheduler/c/scheduler-harness"
          make -s $bins $(for b in $bins; do printf '%s-check ' "$b"; done)
      - name: Conformance, C
        run: deno task conformance $SUITES --c
      - name: Conformance, C with sanitizers
        run: deno task conformance $SUITES --check
