# the tests on every push: the TypeScript tests, and the conformance suites against the TypeScript
# harnesses, the C harnesses and their sanitizer builds (address, undefined behaviour), on Linux
# and macOS. the Makefile says what each runs.

name: core

on:
  push:
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript tests and conformance
        run: make test

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the harnesses
        run: make -s all check
      - name: Conformance, C
        run: make -s test-c
      - name: Conformance, C with sanitizers
        run: make -s test-check

  # how cost grows with size (conformance/perf.ts): reported, never failing the build, until its
  # sizes and perf.sadly_known_fail lists are tuned on a quiet machine
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the harnesses
        run: |
          make -s changeable/c/apply-harness changeable/c/squish-harness crow/c/crow-harness \
            reactivity/c/scheduler-harness
      - name: Performance, TypeScript
        run: deno task perf
      - name: Performance, C
        run: deno task perf --c
